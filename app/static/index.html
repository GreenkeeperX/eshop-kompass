<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eShop-Kompass</title>
<script>try{var t=localStorage.getItem("ek.theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{
  color-scheme:light dark;
  --bg:#f4f2ec; --card:#fffdf8; --ink:#1d2320; --muted:#667069; --line:#dcd8cc;
  --accent:#2f3b35; --warn:#7a3e9d; --warn-bg:#f1e5f7;
  --sale:#b3261e; --best:#ebe8de; --chip:#ece9df; --gold:#c28800; --gold-ink:#2b2000;
  --go:#0d6b4f; --go-bg:#dcefe4; --go-fill:#0d6b4f; --on-go:#fffdf8; --stop:#b3261e; --stop-bg:#f8dfdc; --deal:#2f6690; --brand:#e60012;
}
/* Ansicht: data-theme am html-Element (hell/dunkel), ohne Angabe wie das Gerät */
@media (prefers-color-scheme: dark){:root:not([data-theme=light]){
  --bg:#141816; --card:#1c211f; --ink:#e7ebe8; --muted:#97a19b; --line:#2e3532;
  --accent:#cdd6d1; --warn:#cfa2ee; --warn-bg:#2f2338;
  --sale:#ff8a80; --best:#262c29; --chip:#262c29; --gold:#f2c14e; --gold-ink:#2b2000;
  --go:#5fd0a5; --go-bg:#183328; --go-fill:#22694b; --on-go:#f3fbf6; --stop:#ff8a80; --stop-bg:#3b1c19; --deal:#8cc0e8; --brand:#ff3d48;
}}
:root[data-theme=dark]{color-scheme:dark;
  --bg:#141816; --card:#1c211f; --ink:#e7ebe8; --muted:#97a19b; --line:#2e3532;
  --accent:#cdd6d1; --warn:#cfa2ee; --warn-bg:#2f2338;
  --sale:#ff8a80; --best:#262c29; --chip:#262c29; --gold:#f2c14e; --gold-ink:#2b2000;
  --go:#5fd0a5; --go-bg:#183328; --go-fill:#22694b; --on-go:#f3fbf6; --stop:#ff8a80; --stop-bg:#3b1c19; --deal:#8cc0e8; --brand:#ff3d48;
}
:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{padding:0 16px 60px}
body.fit .wrap{padding-bottom:10px}
.narrow{max-width:1280px}
header.top{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:14px 0 6px}
header.top h1{font-size:23px;margin:0;letter-spacing:-.015em}
header.top #syncBtn{font-size:14px;padding:5px 12px}
header.top h1 a.home{color:inherit;text-decoration:none}
header.top h1 .brand{color:var(--brand)}
header.top .meta{color:var(--muted);font-size:13px;flex:1;min-width:200px}
button,select,input{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
button.link{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline}
button:disabled{opacity:.5;cursor:default}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
/* Kopf und Reiter kommen beim Scrollen mit, verschwinden nach unten weiter, kommen beim Hochscrollen zurück */
.stick{position:sticky;top:0;z-index:7;background:var(--bg);margin-bottom:10px;
  transition:transform .8s cubic-bezier(.4,0,.2,1),opacity .7s ease,margin-top .8s cubic-bezier(.4,0,.2,1)}
.stick.hid{transform:translateY(-100%);opacity:0;pointer-events:none}
body.fit .stick.hid{transform:none;margin-top:calc(-1 * var(--sh,0px))}
.radar thead th,.jump{transition:top .8s cubic-bezier(.4,0,.2,1)}
body.fit .fitbox{max-height:none;transition:height .8s cubic-bezier(.4,0,.2,1)}
@media (prefers-reduced-motion: reduce){.stick,.radar thead th,.jump,.fitbox{transition:none}}
nav button{white-space:nowrap}
a.btn{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;color:var(--ink);text-decoration:none}
a.btn:hover{border-color:var(--accent)}
nav button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:6px 12px;color:var(--muted)}
nav button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:9px 12px;margin-bottom:10px}
.hint{color:var(--muted);font-size:13px;margin:0}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;text-align:right;padding:6px 8px}
td{padding:6px 8px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
.scroll{overflow-x:auto}
th.sth{cursor:pointer;user-select:none}
th.sth:hover{color:var(--ink)}
th.sth .sa{font-size:9px;margin-left:2px}
th small.bc{display:inline;margin-left:3px;font-weight:400;color:var(--muted)}
.pct{color:var(--deal);font-size:11px;margin-left:3px}
.pct.np{color:var(--muted)}
.abv{color:var(--stop)}
.gn{color:var(--go)}
.pct.m-low{background:var(--accent);color:var(--card);border-radius:4px;padding:0 2px;font-weight:600}
.pct.m-best{background:var(--gold);color:var(--gold-ink);border-radius:4px;padding:0 2px;font-weight:700}
.pct.m-best_easy{box-shadow:inset 0 0 0 1.5px var(--gold);color:var(--ink);border-radius:4px;padding:0 2px;font-weight:600}
.gap{color:var(--muted);font-size:11px;margin-left:3px}
.approx{color:var(--warn);margin-right:2px;cursor:help}
.warnc{color:var(--warn)}
.today{color:var(--warn);font-weight:700}
.ok{color:var(--gold);font-weight:600}
.lgt{font-size:10px;font-weight:700;border-radius:3px;padding:0 3px;margin-left:4px;vertical-align:1px;white-space:nowrap}
.lgt.de{border:1px solid var(--line);color:var(--muted)}
.lgt.no{background:var(--stop-bg);color:var(--stop)}
.matrix td.champ,.cmp td.champ{box-shadow:inset 0 0 0 2px var(--gold)}
.matrix td.bp{white-space:nowrap}

.pc .line .cost{font-size:16px}
.bad{color:var(--stop);font-weight:600}
.over,.over a{color:var(--stop)}
.dlc.own{border-color:var(--warn);color:var(--warn)}
tr.part td:first-child{padding-left:16px}
td.lc{white-space:nowrap;text-align:left}
.lg{cursor:help}
.lg.tdb{text-decoration:underline dotted;text-underline-offset:3px}
button.ico{border:0;background:none;padding:0 2px 0 8px;color:var(--muted);cursor:pointer;font-size:13px}
button.ico:hover{color:var(--ink)}
.dlc.need{border-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
.dlc.open{border-style:dashed}   /* Fassung ungeprüft (0.61) */
.matrix td.needr,.cmp td.needr{box-shadow:inset 3px 0 0 var(--warn)}   /* DLC braucht Hauptspiel dieser Region (0.60) */
.matrix td.needr.champ,.cmp td.needr.champ{box-shadow:inset 0 0 0 2px var(--gold),inset 5px 0 0 var(--warn)}
.dlc{font-size:9px;border:1px solid var(--line);border-radius:3px;padding:0 3px;margin-right:4px;color:var(--muted);vertical-align:1px}
a.pl{color:inherit;text-decoration:none}
a.pl:hover{text-decoration:underline;text-decoration-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.chip{font-size:11px;border-radius:999px;padding:0 7px;background:var(--chip);color:var(--muted);white-space:nowrap}
.chip.w{background:var(--warn-bg);color:var(--warn)}

/* Leiste über den Paketen */
.bar{display:flex;flex-wrap:wrap;gap:5px 8px;align-items:center;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:6px 10px;margin-bottom:10px;font-size:13px}
.bar.on{border-color:var(--accent)}
.bar .sp{flex:1}
.bar select{max-width:230px;font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:2px 4px}
.bar button{padding:2px 9px;font-size:12px;border-radius:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;background:none;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--bg);font-weight:600}


/* Länderkarten: Raster (dicht) und Liste (groß) */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(350px,100%),1fr));gap:10px;align-items:start}
.grid.steps{grid-template-columns:repeat(auto-fill,minmax(min(540px,100%),1fr))}
.pc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px 8px;font-size:13px;line-height:1.35;min-width:0}
.pc.cur{border-color:var(--accent)}
.pc>header{display:flex;align-items:baseline;justify-content:space-between;gap:7px}
.pc h2{font-size:15px;margin:0;white-space:nowrap}
.pc .sub{color:var(--muted);font-size:11.5px;margin:0}
.pc .save{font-size:17px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.pc .save small{font-size:11px;font-weight:500;margin-left:2px}
.pc .save.low{color:var(--muted)}
.pc .save.neg{color:var(--sale)}
.pc .line{margin:1px 0 5px;font-variant-numeric:tabular-nums}
.pc .line i{font-style:normal;color:var(--muted);margin:0 5px}
.pc .line small{color:var(--muted)}
.pc table{table-layout:fixed}
.pc th{padding:1px 3px;font-size:10px}
.pc td{padding:2px 3px;font-size:12.5px;vertical-align:top}
.pc td.t{white-space:normal;font-size:13px;line-height:1.25}
.tt{display:flex;gap:5px;align-items:flex-start}
.tt input{margin:2px 0 0;flex:none}
.tt .nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.pc col.c-l{width:88px}.pc col.c-b{width:52px}.pc col.c-e{width:44px}.pc col.c-d{width:44px}
.pc .c-t{display:none}
.soon{color:var(--warn);font-weight:600}
.sugg{display:flex;flex-direction:column;gap:2px;margin-top:5px}
.sugg button{display:flex;gap:7px;align-items:baseline;text-align:left;border:0;background:var(--bg);border-radius:6px;
  padding:2px 7px;font-size:12px;width:100%;font-variant-numeric:tabular-nums}
.sugg button:hover{outline:1px solid var(--accent)}
.sugg .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:60px}
.sugg small{color:var(--muted);white-space:nowrap}
.sugg b{white-space:nowrap}
.foot{display:flex;gap:6px;align-items:center;margin-top:6px}
/* Rechnung in eigener Zeile unter den Knöpfen: Aufklappen schiebt nichts zur Seite (0.58) */
.foot{flex-wrap:wrap}
.foot>.bill{order:9;flex-basis:100%;margin-top:0}
.foot button{padding:1px 8px;font-size:12px;border-radius:6px;white-space:nowrap}
.foot select{flex:1;min-width:0;font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1px 4px}
.restline{margin:10px 2px 0;color:var(--muted);font-size:13px}

.grid.list{grid-template-columns:1fr;max-width:1000px;gap:12px}
.list .pc{font-size:14.5px;padding:14px 18px 12px}
.list .pc h2{font-size:18px}
.list .pc .sub{font-size:12.5px}
.list .pc .save{font-size:23px}
.list .pc .save small{font-size:12px}
.list .pc .line{margin:4px 0 8px}
.list .pc td{font-size:14px;padding:5px 6px}
.list .pc th{font-size:11px;padding:3px 6px}
.list .pc td.t{font-size:14.5px}
.list .tt .nm{display:block}
.list .pc col.c-l{width:140px}.list .pc col.c-b{width:70px}.list .pc col.c-e{width:80px}.list .pc col.c-d{width:80px}
.list .pc .c-t{display:table-cell}
.list .pc col.c-t{display:table-column;width:110px}
.list .pct{font-size:12px}
.list .sugg button{font-size:13.5px;padding:5px 10px}
.list .foot button,.list .foot select{font-size:13px;padding:3px 9px}
.list .chip{font-size:12px}

/* Vergleichstabelle für den gemeinsamen Korb */
.cmp{background:var(--card);border:1px solid var(--line);border-radius:10px;font-size:13px}
.cmp table{width:auto;min-width:100%}
.cmp th,.cmp td{padding:4px 8px;vertical-align:top;min-width:96px}
.cmp tfoot td{white-space:normal}
.cmp tfoot tr.pay td,.cmp tfoot tr.sumtop td{white-space:nowrap}
.cmp thead th{font-size:13px;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:700;vertical-align:bottom}
.cmp thead th small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.cmp td:first-child,.cmp th:first-child{position:sticky;left:0;background:var(--card);min-width:210px;max-width:260px;white-space:normal;z-index:1}
.cmp td small{display:block;color:var(--muted);font-size:11px}
.cmp td small.inl{display:inline}
.cmp tbody td:not(:first-child){white-space:nowrap}
.cmp td.c-buy .abv.gap{color:var(--on-go)}
.cmp .gap{font-size:11px}
/* Korb wie die Titel-Tabelle: fensterhoch, Kopfzeile bleibt stehen (0.61) */
.cmp.fitbox{overflow:auto;max-height:calc(100vh - 150px)}
.cmp thead th{position:sticky;top:0;background:var(--card);z-index:2}
.cmp thead th:first-child{z-index:3}
.cmp thead th.win{background:var(--chip)}
.pc td.t small{display:block;font-size:11px}
.cmp td.na{color:var(--muted)}
.cmp .win{background:var(--chip)}
.cmp thead th.win{box-shadow:inset 0 3px 0 var(--accent)}
.cmp tr.sumtop td{border-top:2px solid var(--line)}
.cmp tr.pay td{font-size:15px;font-weight:700}
.cmp tfoot td:first-child{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.cmp .incomplete{opacity:.6}
.cmp .x,.mini-t .x{border:0;background:none;padding:0 6px 0 0;color:var(--muted)}
.mini-t .x{padding:0 4px;font-size:13px}
.cmp .fl{border:0;background:var(--bg);border-radius:6px;padding:1px 6px;font-size:11.5px;white-space:normal;text-align:right}
.cmp .fl b{white-space:nowrap}
.cmp .chips{justify-content:flex-end;margin:0}
.tagwin{display:inline-block;background:var(--accent);color:var(--card);border-radius:4px;padding:0 5px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}

/* Preisvergleich */
.tools{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tools .seg{margin-left:auto}
.cstatb + .tools{margin-top:16px}   /* Sammlung: Filterzeile mit Luft zum Kopf darüber (0.60) */     /* Ansichtsschalter immer rechts, in jedem Reiter gleich (0.59) */
.tools input[type=search]{flex:1;min-width:180px;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.matrix{background:var(--card);border:1px solid var(--line);border-radius:10px;font-size:13px}
.matrix td,.matrix th{padding:3px 6px}
.matrix.scroll{overflow:auto;max-height:calc(100vh - 150px)}
.matrix th{z-index:2}.matrix th:first-child{z-index:3}.matrix td:first-child{z-index:1}
.matrix td:not(:first-child){white-space:nowrap}
.matrix th{position:sticky;top:0;background:var(--card)}
.matrix td:first-child,.matrix th:first-child{position:sticky;left:0;background:var(--card);min-width:150px;max-width:210px;white-space:normal;box-shadow:1px 0 0 var(--line)}
/* „kaufen“ als kräftiges, aber dunkles Grün: Stern und DE✓ bleiben darauf lesbar (0.53) */
.matrix td.c-buy,.cmp td.c-buy{background:var(--go-fill);color:var(--on-go);font-weight:600}
.matrix td.c-buy small{color:var(--on-go);opacity:.85}
.matrix td.c-buy .lgt.de,.cmp td.c-buy .lgt.de{color:var(--on-go);border-color:currentColor;opacity:.85}
.matrix td.c-good,.cmp td.c-good{background:var(--go-bg)}
.matrix td.nc,.cmp tbody td.nc{opacity:.6}
.matrix tr.grp th{font-size:10px;padding:4px 6px 0;text-align:center;border-bottom:1px solid var(--line);top:0}
.matrix tr.grp th:first-child,.matrix tr.grp th:nth-child(2){border-bottom:0}
.matrix thead tr:nth-child(2) th{top:calc(var(--grp,21px) - 1px)}
.matrix.compact td{padding:2px 6px}
.matrix .tbtn{font-size:13px}
.matrix td.na{color:var(--muted)}
.matrix td small{display:block;color:var(--muted);font-size:10.5px;line-height:1.2}
.star{color:var(--gold);margin-right:2px}

/* Einstellungen */
form.set{display:grid;gap:16px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.fields .pair{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
label.f input[type=checkbox]{width:auto;margin:0 6px 0 0;vertical-align:-2px}
label.f input,label.f select,.set td input[type=text],.set td input[type=number],.set td select{
  background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 9px;color:var(--ink);width:100%}
.set td{text-align:left;vertical-align:middle;padding:4px 8px}
.set th{text-align:left}
.set td input[type=number]{width:90px}
.set td.cards{min-width:230px}
.code{color:var(--muted);font-size:12px;margin-left:4px}
pre.log{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:240px;overflow:auto;font-size:12px;margin:0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;z-index:8}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
@media (max-width:640px){.cmp td:first-child,.cmp th:first-child{min-width:130px;max-width:150px}}
@media (max-width:640px){.list .pc .c-t,.list .pc col.c-t{display:none}.list .pc col.c-l{width:100px}
  .list .pc col.c-b{width:50px}.list .pc col.c-e{width:56px}.list .pc col.c-d{width:56px}}

/* Radar */
.radar{background:var(--card);border:1px solid var(--line);border-radius:10px;font-size:13px}
.radar th,.radar td{padding:4px 9px;vertical-align:top}
.radar thead th{position:sticky;top:var(--stick,0px);background:var(--card);z-index:1}
.radar td:first-child{white-space:normal;min-width:200px;max-width:300px}
.radar td small{display:block;color:var(--muted);font-size:11px}
.radar td.na{color:var(--muted)}
.radar tr.v-none td{opacity:.62}
.tgtc{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}.tgtc button.mini{margin-left:0;min-width:72px}.mini-ph{display:inline-block;min-width:72px;font-size:11px;color:var(--muted);text-align:left}.tgt{width:62px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1px 4px;text-align:right;font-size:12px}
.vd{display:inline-block;border-radius:999px;padding:0 8px;font-size:11.5px;white-space:nowrap}
.vd.buy{background:var(--go-fill);color:var(--on-go);font-weight:700}
.vd.good{background:var(--go-bg);color:var(--go);font-weight:600}
.vd.wait,.vd.none{background:var(--chip);color:var(--muted)}
.cg h3{font-size:14px;margin:2px 0 6px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.cg h3 .link{font-size:12.5px;font-weight:400}
.cg tr.ign td{color:var(--muted)}
.cg h3 .sp{flex:1}
.cg details.fold{margin-top:4px}
/* A–Z spaltenweise: erst die erste Spalte von oben nach unten (0.53.1) */
.cg .cl{columns:220px;column-gap:16px;font-size:13px}
.cg .cl a{display:block;break-inside:avoid;padding:2px 0}
details.cg > summary{cursor:pointer;font-size:14px}
.cgl{margin-top:6px}
.cgd{border-top:1px solid var(--line);padding:4px 0}
.cgd > summary{cursor:pointer;font-size:13.5px}
.cgd .cga{font-size:12.5px;margin:4px 0}
.cg h3 .mut{font-weight:400;font-size:12.5px}
.cg table{width:100%}
.cg td{vertical-align:top;padding:4px 6px 4px 0;border-top:1px solid var(--line)}
.cg td:first-child{width:48%}
.kb{border:1px solid var(--line);background:none;border-radius:6px;padding:0 7px;font-size:12px}
.kb.on{background:var(--accent);border-color:var(--accent);color:var(--card)}
a.tl{color:inherit;text-decoration:none}
a.tl:hover{text-decoration:underline}
a.mini{color:var(--muted);font-size:10px;margin-left:5px;text-decoration:none;border:1px solid var(--line);border-radius:3px;padding:0 3px}
.pc .hide{border:0;background:none;color:var(--muted);padding:0 0 0 6px;font-size:13px}
.bar .srt{font-size:12px}

<body>
<div class="wrap">
  <div class="stick" id="stick">
  <header class="top">
    <h1><a class="home" href="/" title="Startseite, lädt die Seite neu"><span class="brand">eShop</span>Kompass</a></h1>
    <div class="meta" id="meta"></div>
    <button class="help" data-act="legend" title="Legende: Urteil, Farben, Begriffe">?</button>
    <div class="thm"><button id="thmBtn" data-act="thm" aria-haspopup="true" aria-expanded="false"></button><div class="thm-m" id="thmMenu" role="menu" hidden></div></div>
    <button class="primary" id="syncBtn" data-act="sync">Aktualisieren</button>
  </header>

  </div>
  <main id="main"></main>
</div>
<dialog class="vl" id="verlauf"></dialog>
<dialog class="vl" id="legend"></dialog>
<script>
"use strict";
/* Ansicht je Browser: Reiter, Titelansicht, Filter, aufgeklappte Kästen */
function loadView(){ try{ return JSON.parse(localStorage.getItem("ek.view") || "{}") || {}; }catch(e){ return {}; } }
function saveView(){ try{ localStorage.setItem("ek.view", JSON.stringify({tab:S.tab, tview:S.tview, vf:S.vf, folds:S.folds, mDetails:S.mDetails, sorts:S.sorts, colOrder:S.colOrder})); }catch(e){} }
/* Hell, dunkel oder wie das Gerät. Gemerkt je Browser (ek.theme); das Skript im Kopf setzt es
   vor dem ersten Zeichnen, damit nichts aufblitzt. */
const ICO = d => `<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">${d}</svg>`;
const THEMES = [
  ["system", ICO(`<circle cx="8" cy="8" r="6"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor"/>`), "System", "wie dein Gerät"],
  ["light", ICO(`<circle cx="8" cy="8" r="3"/><path d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15M3 3l1 1M12 12l1 1M3 13l1-1M12 4l1-1"/>`), "Hell", ""],
  ["dark", ICO(`<path d="M13.5 10A6 6 0 0 1 6 2.5a6 6 0 1 0 7.5 7.5z"/>`), "Dunkel", ""]];
function themeNow(){ const t = document.documentElement.dataset.theme; return t === "light" || t === "dark" ? t : "system"; }
function renderTheme(){
  const cur = THEMES.find(x => x[0] === themeNow()), b = $("thmBtn");
  b.innerHTML = cur[1];
  b.title = `Ansicht: ${cur[2]}${cur[3] ? ` (${cur[3]})` : ""}. Klick zum Ändern`;
  $("thmMenu").innerHTML = THEMES.map(([k, ic, l, h]) =>
    `<button role="menuitemradio" aria-checked="${k === cur[0]}" class="${k === cur[0] ? "on" : ""}" data-act="thmset" data-v="${k}"><span class="ic">${ic}</span>${l}${h ? ` <small class="mut">${h}</small>` : ""}</button>`).join("");
}
function themeMenu(open){ $("thmMenu").hidden = !open; $("thmBtn").setAttribute("aria-expanded", open); }
function setTheme(k){
  if(k === "system") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = k;
  try{ if(k === "system") localStorage.removeItem("ek.theme"); else localStorage.setItem("ek.theme", k); }catch(e){}
  renderTheme(); themeMenu(false);
}
/* Reihenfolge (0.61): erst was zu tun ist, dann Wunschliste, Korb und Länder (Einkauf), dann was du hast */
const TABS = [["jetzt","Jetzt"],["titel","Titel"],["korb","Korb"],["laender","Länder"],["sammlung","Sammlung"],["settings","Einstellungen"]];
const V0 = loadView();
if(V0.vf === "coll"){ V0.vf = "all"; if(V0.tab === "titel") V0.tab = "sammlung"; }   // bis 0.27 ein Filter im Reiter Titel
const S = {state:null, plans:[], ui:null, tab:TABS.some(t => t[0] === V0.tab) ? V0.tab : "jetzt",
           onlySale:false, collMissing:false, rq:"", vf:V0.vf || "all", tview:V0.tview === "table" ? "table" : "list",
           openTitle:null, folds:V0.folds || {}, mDetails:!!V0.mDetails,
           sorts:V0.sorts && typeof V0.sorts === "object" ? V0.sorts : {}, colOrder:V0.colOrder || "tierbest",
           timer:null, step:"", lastSync:null};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* Sortieren per Klick auf Spaltenköpfe: S.sorts[Tabelle] = {k, dir}. Erster Klick aufsteigend,
   zweiter absteigend, dritter zurück zur gewohnten Reihenfolge. Leere Werte stehen immer am Ende. */
function sth(t, k, label, title = "", cls = ""){
  const s = S.sorts[t], on = !!(s && s.k === k);
  return `<th class="sth ${on ? "on" : ""} ${cls}" data-act="tsort" data-t="${t}" data-k="${esc(k)}" title="${esc(title ? title + " · " : "")}Klick sortiert"${on ? ` aria-sort="${s.dir > 0 ? "ascending" : "descending"}"` : ""}>${label}<span class="sa">${on ? (s.dir > 0 ? "▲" : "▼") : ""}</span></th>`;
}
function sortRows(t, arr, keys){
  const s = S.sorts[t], f = s && keys[s.k];
  if(!f) return arr;
  const empty = v => v === null || v === undefined || v === "" || (typeof v === "number" && !isFinite(v));
  return arr.map((x, i) => [x, f(x), i]).sort((a, b) => {
    const ea = empty(a[1]), eb = empty(b[1]);
    if(ea || eb) return (ea - eb) || (a[2] - b[2]);
    const c = typeof a[1] === "string" ? a[1].localeCompare(b[1], "de") : a[1] - b[1];
    return c * s.dir || (a[2] - b[2]);
  }).map(x => x[0]);
}

async function api(path, body){
  const r = await fetch(path, body === undefined ? {} :
    {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  const j = await r.json();
  if(!r.ok) throw new Error(j.error || r.status);
  return j;
}

/* ---------- Zahlen, Zeiten, Links ---------- */
const DIGITS = {};
function digits(cur){
  if(!(cur in DIGITS)){
    try{ DIGITS[cur] = new Intl.NumberFormat("de-DE",{style:"currency",currency:cur}).resolvedOptions().maximumFractionDigits; }
    catch(e){ DIGITS[cur] = 2; }
  }
  return DIGITS[cur];
}
function money(n, cur){
  if(n === null || n === undefined) return "–";
  try{ return new Intl.NumberFormat("de-DE",{style:"currency",currency:cur||"EUR"}).format(n); }
  catch(e){ return n.toFixed(2).replace(".",",") + " " + (cur||""); }
}
function num(n, cur){   // Landeswährung ohne Zeichen, für enge Spalten; Euro immer mit €
  if(n === null || n === undefined) return "–";
  if(!cur || cur === "EUR") return eur(n);
  const d = digits(cur);
  return n.toLocaleString("de-DE",{minimumFractionDigits:d, maximumFractionDigits:d});
}
const eur = n => money(n, "EUR");
const APPROX = `<span class="approx" title="geschätzt: Guthaben zum Kurs plus pauschalem Aufschlag, weil für das Land kein Kartenpreis lesbar ist">≈</span>`;
const ax = x => x && x.est ? APPROX : "";   // Kennzeichen für geschätzte Europreise
// Sprachfassung: DE✓ bestätigt (oder dasselbe Produkt wie im deutschen eShop), sonst Hinweis
function langTag(x, all){
  if(!x) return "";
  if(x.lang === "de") return `<span class="lgt de" title="Deutsche Fassung in dieser Region bestätigt">DE✓</span>`;
  if(x.lang === "same" && all) return `<span class="lgt de" title="Dieselbe Fassung wie im deutschen eShop">DE✓</span>`;
  if(x.lang === "no") return `<span class="lgt no" title="Andere Fassung als im deutschen eShop, ohne Deutsch">andere Fassung</span>`;
  return "";
}
function endCell(iso, prefix){
  if(!iso) return "";
  const d = new Date(iso);
  if(isNaN(d)) return "";
  const full = d.toLocaleString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
  const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day(d) - day(new Date())) / 86400000);
  let text = d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"}), cls = "";
  if(diff <= 0){ text = "heute"; cls = "today"; }
  else if(diff === 1){ text = "morgen"; cls = "soon"; }
  else if(diff === 2){ cls = "soon"; }
  return `<span class="${cls}" title="Angebot endet ${esc(full)}">${diff <= 1 ? "" : (prefix || "")}${text}</span>`;
}
function ago(iso){
  if(!iso) return "noch nie";
  const min = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
  if(min < 2) return "gerade eben";
  if(min < 90) return `vor ${min} Min.`;
  if(min < 48 * 60) return `vor ${Math.round(min / 60)} Std.`;
  return `vor ${Math.round(min / 1440)} Tagen`;
}
const clock = d => d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
/* "morgen " oder "15.10. " vor einer Uhrzeit, die nicht mehr heute ist */
function whenDay(d){
  const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const n = Math.round((day(d) - day(new Date())) / 86400000);
  return n <= 0 ? "" : n === 1 ? "morgen " : d.toLocaleDateString("de-DE", {day:"2-digit", month:"2-digit"}) + " ";
}
function toast(msg, undo){
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  if(undo){
    const b = document.createElement("button");
    b.textContent = "Rückgängig";
    b.onclick = () => { t.remove(); undo(); };
    t.appendChild(b);
  }
  document.body.appendChild(t);
  setTimeout(() => t.remove(), undo ? 7000 : 2600);
}
const country = code => S.state.countries.find(c => c.code === code) || {name: code, lang: "en"};
const shopOf = code => code ? (country(code).shop || code) : "DE";   // DG nutzt den deutschen eShop
const deku = (slug, code) => `https://www.dekudeals.com/items/${encodeURIComponent(slug)}?country=${shopOf(code).toLowerCase()}`;
// Suche bei eShop-Prices nur mit Buchstaben und Ziffern: Zeichen wie & oder : finden dort nichts
const epSearch = title => `https://eshop-prices.com/games?q=${String(title).replace(/[^\p{L}\p{N}]+/gu, " ").trim().split(" ").map(encodeURIComponent).join("+")}&currency=EUR`;
function shopUrl(code, nsuid){   // Produktseite im eShop des Landes
  if(!nsuid) return null;
  const kind = String(nsuid).startsWith("7001") ? "titles" : String(nsuid).startsWith("7007") ? "bundles" : null;
  return kind ? `https://ec.nintendo.com/${shopOf(code)}/${country(code).lang}/${kind}/${nsuid}` : null;
}
/* Landespreis verlinkt den Verlauf bei DekuDeals, der Europreis die eShop-Seite */
function priceLink(slug, code, text, x, cur){
  const tip = (x && x.eur !== undefined && String(text).includes("€") ? compose(code, x) + " · " : "") +
    "Klick öffnet den Preisverlauf bei DekuDeals" + (x && x.low !== null && x.low !== undefined ? ` · Landestief ${money(x.low, cur)}` : "");
  return `<a class="pl" href="${deku(slug, code)}" target="_blank" rel="noopener" title="${esc(tip)}">${text}</a>`;
}
/* Woraus sich ein Europreis zusammensetzt: Shop-Preis, Steuer, Kurs, Zahlweg */
function compose(code, x){
  const p = S.state.pay[code];
  if(!p || x.eur === null || x.eur === undefined) return "";
  const cur = p.currency, parts = [];
  const net = x.net ?? x.local;
  parts.push(`eShop ${money(net, cur)}` + (p.tax ? ` + ${String(p.tax).replace(".", ",")} % Steuer = ${money(x.local, cur)}` : ""));
  if(p.via === "eur") return parts[0] + ", exakter Betrag";
  if(cur === "EUR" && x.alone && x.alone.cards.length){
    const a = x.alone, cards = a.cards.map(c => `${c.count}× ${eur(c.face)}`).join(" + ");
    return parts.concat(`Guthaben passend gekauft: ${cards} für ${eur(a.eur)}` + (a.rest ? `, ${eur(a.rest)} bleiben als Rest auf dem Konto` : "")).join(" · ") + ` · anteilig ${eur(x.eur)}`;
  }
  if(cur === "EUR" && p.card) return parts.concat(`Guthabenkarte ${eur(p.card.face)} für ${eur(p.card.cost)}${cardSrc(p.card)}, Faktor ${fac(p.card.factor)}, ein Rest bleibt auf dem Konto`).join(" · ") + ` · ergibt ${eur(x.eur)}`;
  parts.push(`Mittelkurs 1 € = ${p.rate.toLocaleString("de-DE", {maximumFractionDigits: p.rate > 20 ? 1 : 3})} ${cur}` +
    (S.state.fx_updated ? ` (Stand ${fxDate()})` : ""));
  if(p.via === "card") parts.push(`Kartenzahlung plus ${pctTxt(p.fee)} Fremdwährungsgebühr, die Bank rechnet mit eigenem Kurs`);
  else if(x.alone && x.alone.cards.length){
    // Guthaben passend zu diesem Titel gekauft; der Rest bleibt auf dem Konto und zählt nicht
    const a = x.alone, cards = a.cards.map(c => `${c.count}× ${money(c.face, cur)}`).join(" + ");
    return parts.concat(`Guthaben passend gekauft: ${cards} für ${eur(a.eur)}` +
      (a.rest ? `, davon ${money(x.local, cur)} für den Titel, ${money(a.rest, cur)} bleiben als Rest` : "")).join(" · ") +
      ` · anteilig ${x.est ? "ungefähr " : ""}${eur(x.eur)}`;
  }
  else if(p.card) parts.push(`Guthabenkarte ${money(p.card.face, cur)} (Wert ${eur(p.card.value)}) für ${eur(p.card.cost)}${cardSrc(p.card)}, Faktor ${fac(p.card.factor)}`);
  else if(p.at_rate) parts.push(`Guthaben in festen Werten zum Kurs${p.fee ? ` plus ${pctTxt(p.fee)} Gebühr deiner Karte` : ""}`);
  else parts.push(`Guthaben geschätzt mit Kurs ${p.markup >= 0 ? "+" : ""}${pctTxt(p.markup)}, weil kein Kartenpreis bekannt ist`);
  return parts.join(" · ") + ` · ergibt ${x.est ? "ungefähr " : ""}${eur(x.eur)}` + aloneTxt(x, cur);
}
/* Woher ein Kartenpreis stammt, für Tooltips */
const cardSrc = k => k.live ? ` (Shop-Preis vom ${stamp(k.live)}${feeTxt(k.fee, k.fee_eur)})` : "";
const feeTxt = (pct, fix) => pct || fix ? ` mit Servicegebühr ${[fix ? eur(fix) : "", pct ? pctTxt(pct) : ""].filter(Boolean).join(" + ")}` : "";
const stamp = sec => new Date(sec * 1000).toLocaleString("de-DE", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"});
/* Faktor einer Guthabenkarte: Preis ÷ Wert zum Mittelkurs (0.53) */
const fac = f => f === null || f === undefined ? "–" : f.toLocaleString("de-DE", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const RATE_CLS = {top: "gn", good: "gn", cheaper: "gn", ok: "", same: "", bad: "warnc", dearer: "abv"};
const rateCls = r => r && r.level ? RATE_CLS[r.level] ?? "" : "";
const rateHtml = r => r ? `<span class="${r.level ? RATE_CLS[r.level] ?? "" : "mut"}"${r.best ? ` title="Maßstab: ${r.level === "cheaper" || r.level === "dearer" || r.level === "same" ? "Faktor deiner Kreditkarte" : "bester Faktor dieser Karte in 90 Tagen"} ${fac(r.best)}"` : ""}>${esc(r.text)}</span>` : "";
/* Guthabenkarten eines Landes für die Einstellungen: Wert, Preis, Faktor, Bewertung */
function cardRows(code){ return (S.state.card_status || {})[code] || []; }
function cardSummary(code){
  const rows = cardRows(code).filter(r => r.stock && r.factor !== null), pi = S.state.pay[code] || {};
  if(!rows.length) return "";
  const best = rows.reduce((a, r) => r.factor < a.factor ? r : a);
  const x = S.state.settings.countries[code] || {};
  const verdict = x.pay === "auto" || x.pay === "card" ? (best.rating && best.rating.level === "cheaper" ? "Guthaben günstiger" : "Kreditkarte günstiger")
    : pi.rating && pi.rating.text ? pi.rating.text.split(",")[0] : "";
  const vc = verdict === "Guthaben günstiger" ? "gn" : verdict === "Kreditkarte günstiger" ? "" : pi.rating && pi.rating.level ? rateCls(pi.rating) : "mut";
  return ` · bester Faktor <span class="${rateCls(best.rating)}">${fac(best.factor)}</span>${verdict ? ` · <span class="${vc}">${esc(verdict)}</span>` : ""}`;
}
function cardTable(code, cur){
  const rows = cardRows(code);
  if(!rows.length) return "";
  const price = r => {
    if(r.live) return `<span title="Shop-Preis vom ${stamp(r.live)}${feeTxt(r.fee, r.fee_eur)}">${eur(r.cost)}</span> <small class="mut">Shop, ${new Date(r.live * 1000).toLocaleDateString("de-DE", {day:"2-digit", month:"2-digit"})}${r.fee || r.fee_eur ? ", mit Gebühr" : ""}</small>` +
      (r.error ? ` <small class="warnc" title="Der letzte Abruf scheiterte. Der zuletzt gelesene Preis gilt bis zu 14 Tage weiter.">letzter Abruf: ${esc(r.error)}</small>` : "");
    if(r.url && r.checked) return `${r.manual === null ? "–" : `${eur(r.manual)} <small class="mut">eingetragen</small>`} <small class="warnc">${esc(r.error || "kein Preis")}</small>`;
    if(r.url && r.manual === null) return `<small class="mut">wird beim nächsten Abgleich gelesen</small>`;
    if(r.cost !== null) return `${eur(r.cost)} <small class="mut">eingetragen</small>`;
    return `<small class="mut">zum Kurs</small>`;
  };
  return `<table class="cards"><thead><tr><th>Karte</th><th title="Wert zum Mittelkurs">Wert</th><th>Preis</th><th title="Preis ÷ Wert. 1,00 heißt: Guthaben zum Kurs. 0,85 heißt: 100 € Guthaben kosten 85 €.">Faktor</th><th>Bewertung</th></tr></thead><tbody>${rows.map(r =>
    `<tr class="${r.stock ? "" : "mut"}"><td>${cur ? money(r.face, cur) : num(r.face)}</td><td>${r.value === null ? "–" : eur(r.value)}</td><td>${price(r)}</td>
      <td class="${r.stock ? rateCls(r.rating) : ""}">${fac(r.factor)}</td><td>${r.stock ? rateHtml(r.rating) : "nicht vorrätig"}${r.used ? ` <span class="chip" title="Diese Karte rechnet das Tool für die Preise dieses Landes">genutzt</span>` : ""}</td></tr>`).join("")}</tbody></table>`;
}
/* Einzelkauf: welche Karten ein Titel allein braucht und was übrig bleibt */
function aloneTxt(x, cur){
  const a = x.alone;
  if(!a) return "";
  const cards = a.cards.map(c => `${c.count}× ${money(c.face, cur)}`).join(" + ");
  return ` · allein gekauft: ${eur(a.eur)}${cards ? ` (${cards}${a.rest ? `, Rest ${money(a.rest, cur)}` : ""})` : ""}`;
}
const pctTxt = v => String(v ?? "").replace(".", ",") + " %";
function fxStamp(){
  const d = new Date(S.state.fx_updated);
  return isNaN(d) ? (S.state.fx_updated || "–") : d.toLocaleString("de-DE", {day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit"});
}
function fxDate(){
  const d = new Date(S.state.fx_updated);
  return isNaN(d) ? S.state.fx_updated : d.toLocaleDateString("de-DE");
}
function buyLink(code, x, text){
  const url = shopUrl(code, x.nsuid), tip = esc(compose(code, x));
  return url ? `<a class="pl" href="${url}" target="_blank" rel="noopener" title="${tip} · Klick öffnet den eShop ${esc(country(code).name)}">${text}</a>`
             : `<span title="${tip}">${text}</span>`;
}
function costTip(p){
  if(p.is_ref){
    const c = (S.state.pay[p.code] || {}).card;
    return c ? `Kauf in Deutschland mit Guthabenkarten: ${eur(c.face)} für ${eur(c.cost)}, ein Rest bleibt auf dem Konto` : "Kauf in Deutschland, exakter Betrag";
  }
  const info = S.state.pay[p.code] || {};
  if(p.via === "card") return `Per Karte: ${money(p.total, p.currency)} zum Mittelkurs plus ${pctTxt(info.fee)} Gebühr. Die Abrechnung deiner Bank kann leicht abweichen.`;
  if(p.estimated) return `Geschätzt: ${money(p.total, p.currency)} zum Kurs ${info.markup >= 0 ? "+" : ""}${String(info.markup ?? "").replace(".", ",")} %, weil keine Guthabenkarten eingetragen sind`;
  const sum = p.cards.reduce((a, c) => a + c.count * c.face, 0);
  return `Guthabenkarten über ${money(sum, p.currency)} für ${eur(p.cost)}` + (p.rest ? `, davon bleiben ${money(p.rest, p.currency)} als Rest` : ", kein Rest");
}

/* ---------- Deal-Güte ---------- */
const MARK = {best:"Bestpreis über alle Länder", low:"Tiefstpreis dieses Landes", sale:"Angebot über dem Tiefstpreis"};
function markTip(x, cur){
  return [MARK[x.mark] || "kein Angebot",
    x.gap ? `${x.gap} % über Bestpreis` : "",

/* ---------- Zustand ---------- */
const planBody = (basket = []) => ({overrides:S.ui.overrides, must:[], basket});
function saveUi(){ return api("/api/ui", S.ui).catch(err => toast("Nicht gespeichert: " + err.message)); }
function migrateLocal(){   // frühere Versionen merkten sich den Korb im Browser
  try{
    const b = JSON.parse(localStorage.getItem("ek.basket") || "null");
    const o = JSON.parse(localStorage.getItem("ek.overrides") || "null");
    const empty = !S.ui.basket && !Object.keys(S.ui.overrides).length;
    if(empty && ((Array.isArray(b) && b.length) || (o && Object.keys(o).length))){
      if(Array.isArray(b) && b.length) S.ui.basket = b;
      if(o) S.ui.overrides = o;
      saveUi();
    }
    localStorage.removeItem("ek.basket"); localStorage.removeItem("ek.overrides"); localStorage.removeItem("ek.dense");
  }catch(e){}
}
async function loadPlans(){
  // Länder zeigen immer die Körbe je Land; der gemeinsame Korb (Reiter Korb) rechnet extra (0.59)
  const r = await api("/api/plans", planBody());
  S.plans = r.plans;
  const b = S.ui.basket ? await api("/api/plans", planBody(S.ui.basket)) : null;
  S.bplans = b ? b.plans : []; S.mix = b ? b.mix : null;
  S.kauf = await api("/api/kaufplan");
}
async function refresh(){
  S.state = await api("/api/state");
  S.ui = S.state.ui;
  S.lastSync = S.state.last_sync;
  migrateLocal();
  if(S.ui.basket){   // Titel, die nicht mehr auf der Wishlist stehen, fallen aus dem Korb
    const known = new Set(S.state.matrix.rows.map(r => r.slug));
    S.ui.basket = S.ui.basket.filter(s => known.has(s));
    if(!S.ui.basket.length) S.ui.basket = null;
  }
  await loadPlans();
  render();
  watch();
}
async function replan(){
  if(S.ui.basket && !S.ui.basket.length) S.ui.basket = null;
  saveUi();
  await loadPlans();
  render();
}
/* Änderung mit Rückweg: merkt sich den Stand davor */
async function change(label, fn){
  const before = JSON.stringify(S.ui);
  fn();
  await replan();
  toast(label, async () => { S.ui = JSON.parse(before); await replan(); });
}
function watch(){
  if(S.timer || !S.state.status.running) return;
  S.timer = setInterval(async () => {
    const st = await api("/api/status");
    const stepChanged = st.step !== S.step;
    S.step = st.step;
    S.state.status = st;
    if(!st.running){
      clearInterval(S.timer); S.timer = null;
      try{ await refresh(); }catch(e){ toast("Fehler beim Neuladen: " + e.message); }
      toast(st.ok ? "Abgleich fertig" : "Abgleich fehlgeschlagen");
    }
    else if(stepChanged && /^(Sprachen|Tiefstpreise)/.test(st.step)){ await refresh(); }   // Preise sind da
    else renderHead();
    showLog(st.log);
  }, 2000);
}
/* Offene Seite hält sich selbst aktuell */
setInterval(async () => {
  if(!S.state || S.timer || document.hidden) return;
  try{
    const st = await api("/api/status");
    if(st.running){ S.state.status = st; renderHead(); watch(); }
    else if(st.last_sync !== S.lastSync && S.tab !== "settings") await refresh();
    else renderHead();
  }catch(e){}
}, 60000);

/* Protokoll: neueste Zeile unten, die Box folgt ihr, solange du nicht hochgescrollt hast */
/* Der Server schreibt UTC, angezeigt wird die Uhrzeit deines Browsers */
function localStamp(line){
  const m = /^(\d\d):(\d\d):(\d\d)( .*)$/s.exec(line);
  if(!m) return line;
  const d = new Date(); d.setUTCHours(+m[1], +m[2], +m[3], 0);
  return d.toLocaleTimeString("de-DE") + m[4];
}
function showLog(lines){
  const l = $("log");
  if(!l) return;
  const atEnd = l.scrollHeight - l.scrollTop - l.clientHeight < 30;
  const st = S.state.status || {};
  const head = st.started ? `Abgleich vom ${new Date(st.started).toLocaleString("de-DE")}, v${S.state.version}${st.running ? ", läuft" : st.ok === false ? ", fehlgeschlagen" : ""}\n` : "";
  l.textContent = (lines || []).length ? head + lines.map(localStamp).join("\n") : "Noch kein Protokoll seit dem letzten Neustart.";
  if(atEnd || !l.dataset.seen){ l.scrollTop = l.scrollHeight; l.dataset.seen = "1"; }
}
function renderHead(){
  const st = S.state.status, hours = S.state.settings.refresh_hours || 6;
  const m = $("meta");
  if(st.running){
    m.textContent = `${st.step}${st.total ? ` (${st.done}/${st.total})` : ""} …`;
  } else {
    const last = S.state.last_sync ? new Date(S.state.last_sync) : null;
    const stale = last && Date.now() - last > 2 * hours * 3600000;
    let next = last ? new Date(+last + hours * 3600000) : null;
    if(st.boot_sync && (!next || new Date(st.boot_sync) < next)) next = new Date(st.boot_sync);   // einmal nach dem Start
    m.innerHTML = `<span class="${stale ? "warnc" : ""}" title="${last ? esc(last.toLocaleString("de-DE")) : ""}">Stand ${ago(S.state.last_sync)}</span>` +
      (next ? ` · nächster Abgleich ${next < new Date() ? "in Kürze" : "ca. " + whenDay(next) + clock(next)}` : "") +
      ` · ${S.state.item_count} Titel · v${esc(S.state.version)}`;
  }
  $("syncBtn").disabled = st.running;
  $("nav").innerHTML = TABS.map(([k,l]) =>
    `<button data-act="tab" data-tab="${k}" class="${S.tab===k?"on":""}">${l}${k === "korb" && S.ui && S.ui.basket ? ` <small class="mut">${S.ui.basket.length}</small>` : ""}</button>`).join("");
}
function banners(){
  let h = "";
  const st = S.state.status;
  if(!S.state.settings.wishlist_url)
    h += `<div class="banner">Trage unter Einstellungen deinen DekuDeals-Wishlist-Link ein und klicke auf Aktualisieren.</div>`;
  else if(!S.state.last_sync && !st.running)
    h += `<div class="banner">Noch kein Abgleich. Der erste Lauf sucht die Titel-IDs und dauert einige Minuten.</div>`;
  const warn = ((S.state.checks || {}).warnings || []);
  if(warn.length && !st.running)
    h += `<div class="banner">Selbstprüfung nach dem letzten Abgleich: ${warn.map(esc).join(" · ")}.
      <button class="link" data-act="showlog">Protokoll öffnen</button></div>`;
  if(st.ok === false){
    const last = (st.log || []).filter(l => !/Abbruch|^\s/.test(l.slice(9))).pop() || "";
    const why = (st.log || []).filter(l => /Abbruch/.test(l)).pop() || last;
    h += `<div class="banner">Letzter Abgleich fehlgeschlagen: ${esc(why.replace(/^\S+ (Abbruch: )?/, ""))}.
      <button class="link" data-act="showlog">Protokoll öffnen</button></div>`;
  }
  return h;
}
let fitMatrix = () => {}, showStick = () => {};
/* Sofort kopieren, noch im Klick: Öffnet der Klick einen neuen Tab, verliert die Seite den Fokus,
   und navigator.clipboard lehnt danach ab (Firefox). execCommand kopiert synchron (0.57.1). */
function copyNow(text){
  const t = document.createElement("textarea");
  t.value = text; t.style.cssText = "position:fixed;top:0;left:0;opacity:0";
  const back = document.activeElement;
  document.body.appendChild(t); t.focus(); t.select();   // Firefox kopiert nur aus dem fokussierten Feld (0.58)
  let ok = false;
  try{ ok = document.execCommand("copy"); }catch(e){}
  t.remove();
  if(back && back.focus) back.focus();
  if(!ok) try{ navigator.clipboard.writeText(text); }catch(e){}
}
function render(){
  if(S.handover) return;          // Fenster für das JP-Lesezeichen, siehe jpHandOver
  renderHead();
  const m = $("main");
  // Seitlich und senkrecht gescrollte Tabellen bleiben, wo sie waren, etwa nach dem Sortieren (0.61)
  const keep = S.drawnTab === S.tab ? [...m.querySelectorAll(".scroll,.fitbox")].map(e => [e.scrollLeft, e.scrollTop]) : [];
  S.drawnTab = S.tab;
  m.className = S.tab === "settings" ? "narrow" : "";
  if(S.tab === "jetzt") m.innerHTML = banners() + viewJetzt();
  else if(S.tab === "titel") m.innerHTML = banners() + (S.tview === "table" ? viewMatrix() : viewTitles());
  else if(S.tab === "sammlung") m.innerHTML = banners() + viewCollection();
  else if(S.tab === "laender") m.innerHTML = banners() + viewCards();
  else if(S.tab === "korb") m.innerHTML = banners() + (S.ui.basket ? viewCompare() : viewKorbEmpty());
  else { m.innerHTML = viewSettings(); showLog(S.state.status.log); }
  // Tabellen mit eigenem Scrollkasten, fensterhoch: Titel-Tabelle und Korb (0.61)
  document.body.classList.toggle("fit", (S.tab === "titel" && S.tview === "table" || S.tab === "korb" && !!document.querySelector(".fitbox")) && innerWidth > 700);
  if(!document.body.classList.contains("fit")) showStick();
  fitMatrix();
  m.querySelectorAll(".scroll,.fitbox").forEach((e, k) => { if(keep[k]){ e.scrollLeft = keep[k][0]; e.scrollTop = keep[k][1]; } });
  const grp = m.querySelector(".matrix tr.grp");
  if(grp) grp.closest(".matrix").style.setProperty("--grp", grp.getBoundingClientRect().height + "px");
}
const rowOf = slug => S.state.matrix.rows.find(r => r.slug === slug) || {title:slug, slug};
const inBasket = slug => (S.ui.basket || []).includes(slug);

/* ---------- Signale: ein Urteil, ein Wechsel, feste Farben ---------- */
const VERDICT = {buy:"kaufen", good:"gut", wait:"warten", none:"kein Urteil"};
const TIER = {1:"leicht", 2:"mittel", 3:"schwer"};
const tierTag = t => t && TIER[t] ? `<span class="tier" title="Wechselstufe">${TIER[t]}</span>` : "";
const pill = v => v === "none" || !v ? `<span class="mut">kein Urteil</span>` : `<span class="vd ${v}">${VERDICT[v]}</span>`;
const star = x => x && x.mark === "best" ? `<span class="star" title="Einkaufspreis erreicht den Bestpreis">★</span>` : "";
/* Bis 2 % über dem Bestpreis gilt ein Preis als Bestpreis, wie im Urteil (BEST_TOLERANCE) */
const atBest = (eurNow, champ) => eurNow <= champ * 1.02 + 0.005;
const nearTip = d => d >= 0.005 ? ` title="${eur(d)} über dem Bestpreis, das zählt noch als Bestpreis (bis 2 %)"` : "";
/* Abstand zum Bestpreis als Text: am Bestpreis in der Farbe des Urteils, +x € rot (teurer) */
function overBest(eurNow, champ, grade){
  if(eurNow === null || eurNow === undefined || !champ) return `<span class="mut">–</span>`;
  const d = eurNow - champ;
  const cls = grade ? "g-" + grade : "";
  return atBest(eurNow, champ) ? `<span class="${cls}"${nearTip(d)}>am Bestpreis</span>` : `<span class="abv">+${eur(d)}</span>`;
}
/* Wo ein Titel im Kaufplan steht: im Plan, Wechsel lohnt nicht, besser warten */
function planState(slug){
  const k = S.kauf;
  if(!k) return "";
  const n = k.steps.findIndex(p => p.items.some(i => i.slug === slug));
  if(n >= 0) return `im Plan, Schritt ${n + 1} (${esc(k.steps[n].name)})`;
  const d = k.dropped.find(x => (x.open_slugs || []).includes(slug));
  if(d && d.blocked_by) return `nicht im Plan: Rest in ${esc(d.name)} blockiert den Wechsel`;
  if(d) return `nicht im Plan: Wechsel nach ${esc(d.name)} lohnt nicht`;
  if(k.later.some(l => l.slug === slug)) return "nicht im Plan: lieber warten";
  if((k.held || []).some(h => h.slug === slug) && k.lock) return `nicht im Plan: Konto in ${esc(k.lock.name)} gesperrt, bis das Guthaben aufgebraucht ist`;
  const s2 = (k.s2_skip || []).find(x => x.slug === slug);
  if(s2) return `nicht im Plan: nur ein Weg zur Switch 2: ${esc(s2.reason)}`;
  const pk = (k.packed || []).find(x => x.slug === slug);
  if(pk) return `nicht einzeln im Plan: steckt in ${esc(pk.pack)}`;
  if((k.bought_slugs || []).includes(slug)) return (S.state.radar.find(r => r.slug === slug) || {}).owned ? "nicht im Plan: steht schon in deiner Sammlung" : "nicht im Plan: schon gekauft, steht noch auf der Wishlist";
  return "";
}

/* Angebotsrhythmus je Land aus den DekuDeals-Verläufen, ohne Vorhersage */

/* ---------- Länder: Angebote je Land ---------- */
function sortPlans(list){
  const endOf = p => Math.min(Infinity, ...p.items.filter(i => i.end).map(i => +new Date(i.end)));
  const sav = (a, b) => (b.gain ?? b.saving ?? -1e9) - (a.gain ?? a.saving ?? -1e9);
  const opt = (a, b) => (a.opt_gap ?? 1e9) - (b.opt_gap ?? 1e9) || sav(a, b);
  const by = {optimum: opt, saving: sav, rest: (a, b) => (a.rest_value ?? a.rest_eur ?? 1e9) - (b.rest_value ?? b.rest_eur ?? 1e9) || sav(a, b),
              end: (a, b) => endOf(a) - endOf(b) || sav(a, b), tier: (a, b) => a.tier - b.tier || sav(a, b)}[S.ui.sort] || sav;
  // Das Land, in dem das Konto steht, vorn, dann die Alternativen, Deutschland als Vergleich am Ende
  const cur = list.filter(p => p.current), rest = list.filter(p => !p.current);
  return cur.concat(rest.filter(p => !p.is_ref).sort(by), rest.filter(p => p.is_ref));
}

  const cards = [], empty = [];
  for(const p of sortPlans(cardPlans())){

/* Was beim Wechsel verfällt: Guthaben aus dem Kontoland, Rest dieses Schritts */

/* Zeile „Wechsel“: lohnt der Weg in dieses Land gegenüber der Alternative? */

/* DLC, deren Hauptspiel nicht im Korb liegt und aus dieser Region kommen muss (Europa passt zum deutschen Konto) */

function wishOpts(rows, label){
  const vd = slug => (S.state.radar.find(x => x.slug === slug) || {}).verdict || "none";
  const groups = [["buy", "kaufen"], ["good", "gut"], ["wait", "warten"], ["none", "ohne Urteil"]];
  return groups.map(([v, l]) => {
    const g = rows.filter(r => vd(r.slug) === v).sort((a, b) => a.title.localeCompare(b.title, "de"));
    return g.length ? `<optgroup label="${l}">${g.map(r => `<option value="${esc(r.slug)}">${esc(r.title)}${(r.dlc_of || rowOf(r.slug).dlc_of) ? " (DLC)" : ""}${label ? " · " + label(r) : ""}</option>`).join("")}</optgroup>` : "";

/* DLC außerhalb Europas (ab 0.61): Ob er zum Spiel aus Europa passt, sagt die Programm-ID in titledb.

function needsRegion(dlc, code, slug){
  const fam = code && country(code).family;
  if(!dlc || !fam || fam === "EU") return "";
  const fit = ((S.state.dlc_fit || {})[slug] || {})[fam];
  return fit === true ? "" : fit === false ? "need" : "open";

const needMark = (code, kind) => kind === "need" ? `<span class="dlc need" title="${esc(needTip(code, kind))}">DLC</span>`
  : kind === "open" ? `<span class="dlc open" title="${esc(needTip(code, kind))}">DLC?</span>` : "";
const needTip = (code, kind) => kind === "need" ? `Eigene Fassung in ${country(code).family_name}: Dieser DLC braucht das Hauptspiel aus dieser Region, zu deinem Spiel aus Europa passt er nicht`

function planFactor(p){
  const info = S.state.pay[p.code] || {}, face = p.cards.reduce((a, c) => a + c.count * c.face, 0);
  if(!face || !info.rate || p.estimated) return null;
  return p.cost / (face / (p.currency === "EUR" ? 1 : info.rate));
}
/* Nur Guthaben: wie weit die Karte gerade über ihrem 90-Tage-Bestwert liegt, ab „teuer“ */
function giftOver(p){
  const r = (S.state.pay[p.code] || {}).rating, k = (S.state.pay[p.code] || {}).card;
  if(p.is_ref || !r || r.level !== "bad" || !r.best || !k || p.currency === "EUR") return 0;
  return Math.round(100 * (k.factor / r.best - 1));

/* Hürden: was den Kauf hier erschwert, rot heißt nein, violett heißt prüfen */
function hurdles(p, last){
  const out = [];
  if(giftOver(p)) out.push(`<span class="warnc" title="Guthaben gerade ${giftOver(p)} % über seinem Bestwert der letzten 90 Tage. Wenn die Titel nicht drängen: Warten lohnt eher wegen des Guthabens.">Guthaben teuer</span>`);
  for(const w of p.warnings){
    // Im letzten Schritt des Kaufplans folgt kein Wechsel mehr: Der Rest bleibt, ein späterer Wechsel wartet auf ihn
    if(w.startsWith("Rest blockiert") && last) out.push(`<span class="warnc" title="Der Kaufplan wechselt danach nicht mehr. Ein späterer Wechsel geht erst, wenn das Guthaben aufgebraucht ist.">Rest bleibt, blockiert spätere Wechsel</span>`);
    else if(w.startsWith("Rest blockiert")) out.push(`<span class="bad" title="${esc(w)}, bis das Guthaben 0 ist">Rest blockiert Wechsel</span>`);
    else if(w.startsWith("Keine Guthabenkarten")) out.push(`<span class="warnc" title="${esc(w)}">Karten fehlen, geschätzt</span>`);
    // In Europa passt das Hauptspiel ohnehin. Sonst nur DLC mit eigener Fassung in dieser Region (Programm-ID, 0.61)
    else if(w.startsWith("DLC braucht")){
      const kind = i => i.needs_parent ? needsRegion(i.dlc_of, p.code, i.slug) : "";
      const need = p.items.filter(i => kind(i) === "need"), open = p.items.filter(i => kind(i) === "open");
      if(need.length) out.push(`<span class="warnc" title="Eigene Fassung in ${esc(p.family)}: Diese DLC brauchen das Hauptspiel aus dieser Region. Betroffen: ${esc(need.map(i => i.short).join(", "))}"><span class="dlc need">DLC</span>${need.length === 1 ? "braucht" : `${need.length}× brauchen`} Region ${esc(p.family)}</span>`);

    }

    else if(/ungeprüfter Sprache/.test(w)) out.push(`<span class="warnc" title="Für diese Region liegt noch keine Sprachangabe vor">${parseInt(w)}× Sprache ungeprüft</span>`);

/* ---------- Länder: gemeinsamer Korb als Vergleichstabelle ---------- */
function viewCompare(){
  const inB = new Set(S.ui.basket);
  const opts = wishOpts(S.state.matrix.rows.filter(r => !inB.has(r.slug) && !r.no_ids));
  const shown = S.bplans.filter(p => p.is_ref || !S.ui.hidden.includes(p.code));
  const usable = shown.filter(p => p.rate && p.items.length);
  const cols = usable.filter(p => p.is_ref).concat(usable.filter(p => !p.is_ref));
  const none = shown.filter(p => !usable.includes(p));
  const complete = cols.filter(p => !p.missing.length && p.cost !== null);
  const win = complete.length > 1 ? complete.reduce((a, b) => b.cost < a.cost ? b : a) : null;
  const easy = complete.filter(p => p.tier <= 2);
  const winEasy = easy.length ? easy.reduce((a, b) => b.cost < a.cost ? b : a) : null;

  const single = complete.filter(p => p.tier === 1 && p.via === "card" || p.is_ref).reduce((a, b) => !a || b.cost < a.cost ? b : a, null);
  const mixWins = !!(S.mix && S.mix.parts.length > 1 && (!single || S.mix.cost < single.cost - 0.5));
  let verdict = `<span class="hint">Kein Land bietet den ganzen Korb, deshalb ist nichts hervorgehoben.</span>`;
  if(win){
    verdict = `<span>Günstigstes Land: <b>${esc(win.name)}</b>, ${win.estimated ? "ca. " : ""}${eur(win.cost)}` +
      (winEasy && winEasy.code !== win.code ? ` · leicht erreichbar: <b>${esc(winEasy.name)}</b>, ${eur(winEasy.cost)}` : "") +
      (mixWins ? ` · <span title="Jeder Titel im günstigsten Land mit Kartenzahlung, Aufteilung steht unter der Tabelle">aufgeteilt: <b>${eur(S.mix.cost)}</b></span>` : "") + `</span>`;
  } else if(complete.length === 1){
    verdict = `<span class="hint">Nur ${esc(complete[0].name)} bietet den ganzen Korb.</span>`;
  }
  // Werkzeugzeile wie in den anderen Reitern: links dazunehmen, rechts Korb leeren; das Ergebnis darunter (0.60)
  let h = `<div class="tools"><select data-act="bpick" title="Deine Wishlist-Titel, die noch nicht im Korb sind"><option value="">Wishlist-Titel dazunehmen …</option>${opts}</select>
    <button class="sm" style="margin-left:auto" data-act="unshare" title="Korb leeren; die Länder behalten ihre eigenen Körbe">Korb leeren</button></div>
    <div class="bar on">${verdict}</div>
    <p class="hint">Was genau diese Titel in jedem Land kosten, mit Guthabenkarten und Rest wie auf den Länderkarten. Zellfarbe wie in der Titel-Tabelle: dunkelgrün „kaufen“, hellgrün „gut“, gold umrandet der Bestpreis; rot nur der Betrag darüber. Ein Klick auf den Preis öffnet die Seite im eShop, bei DLC den Verlauf bei DekuDeals (für DLC gibt es keinen festen eShop-Link); ein Klick auf den Ländernamen sortiert.</p>`;
  if(!cols.length) return h + `<p class="restline">Kein Titel aus dem Korb ist in einem aktiven Land kaufbar.</p>` + hiddenLine();

  const cls = p => (win && p.code === win.code ? "win " : "") + (p.missing.length ? "incomplete " : "");
  const ks = S.sorts.korb, arrow = k => ks && ks.k === k ? `<span class="sa">${ks.dir > 0 ? "▲" : "▼"}</span>` : "";
  const sortTh = (k, cls2, inner, tip) => `<th class="sth ${ks && ks.k === k ? "on" : ""} ${cls2}" data-act="tsort" data-t="korb" data-k="${esc(k)}" title="${esc(tip)} · Klick sortiert">${inner}${arrow(k)}</th>`;
  h += `<div class="cmp fitbox"><table><thead><tr>${sortTh("title", "", `${S.ui.basket.length} Titel`, "nach Titel")}${sortTh("best", "", "Bestpreis<small>24 Monate, alle Länder</small>", "Niedrigster Einkaufspreis der letzten 24 Monate über alle zählenden Länder")}` + cols.map(p =>
    sortTh(p.code, cls(p), `${win && p.code === win.code ? `<span class="tagwin">günstigstes</span><br>` : ""}${esc(p.name)}
      <small>${p.is_ref ? "Vergleichsbasis" : TIER[p.tier] || ""}${p.current ? " · Konto hier" : ""}${p.missing.length ? ` · ${p.items.length} von ${S.ui.basket.length}` : ""}</small>`, `nach dem Preis in ${p.name}`)).join("") + `</tr></thead><tbody>`;
  const itemIn = (p, slug) => p.items.find(i => i.slug === slug) || null;
  const order = sortRows("korb", S.ui.basket.slice(), Object.assign({title: s => rowOf(s).title, best: s => (rowOf(s).champ || {}).eur ?? null},
    Object.fromEntries(cols.map(p => [p.code, s => (itemIn(p, s) || {}).eur ?? null]))));
  for(const slug of order){
    const r = rowOf(slug);
    const cells = cols.map(p => itemIn(p, slug));
    h += `<tr><td title="${esc(r.title)}"><button class="x" data-act="bdrop" data-s="${esc(slug)}" title="aus dem Korb nehmen">×</button>${r.dlc_of ? `<span class="dlc">DLC</span>` : ""}<a class="tl" href="${deku(slug)}" target="_blank" rel="noopener">${esc(r.title)}</a></td>` +
      `<td class="bp">${r.champ ? `${ax(r.champ)}<b title="Bestpreis in ${esc(country(r.champ.code).name)}">${eur(r.champ.eur)}</b> <small class="inl">${r.champ.code}</small>` : `<span class="mut">–</span>`}</td>` +
      cols.map((p, k) => {
        const i = cells[k];
        if(!i){
          const m = p.missing.find(x => x.slug === slug);
          return `<td class="na ${cls(p)}" title="${m && m.nolang ? "keine deutsche Fassung" : "dort nicht kaufbar"}">${m && m.nolang ? "ohne DE" : "–"}</td>`;
        }
        // Eine Zeile wie in der Titel-Tabelle (0.61): Preis, Rabatt, Abstand zum Bestpreis. Landeswährung,
        // Zahlweg und Angebotsende stehen im Tooltip; die Zelle färbt sich nach dem Urteil
        const ch = r.champ ? r.champ.eur : null, gap = ch !== null && !atBest(i.eur, ch) ? i.eur - ch : 0;
        const champHere = r.champ && r.champ.code === p.code;
        const counts = !i.nocard && i.lang !== "unknown";
        const g = counts && i.sale && i.grade && i.grade !== "wait" ? "c-" + i.grade : "";
        const need = i.needs_parent ? needsRegion(r.dlc_of, p.code, slug) : "";
        const url = shopUrl(p.code, i.nsuid);
        const tip = [compose(p.code, i), p.currency === "EUR" ? "" : `im Shop ${money(i.local, p.currency)}`,
          i.sale && i.end ? `Angebot bis ${dm(i.end)}` : "", gap > 0.005 ? `${eur(gap)} über dem Bestpreis ${eur(ch)} in ${country(r.champ.code).name}` : "",
          champHere ? "Hier gab es den Bestpreis" : "", need ? needTip(p.code, need) : "",
          url ? `Klick öffnet den eShop ${country(p.code).name}` : "Klick öffnet den Verlauf bei DekuDeals"].filter(Boolean).join(" · ");
        const price = `<a class="pl" href="${url || deku(slug, p.code)}" target="_blank" rel="noopener">${num(i.eur)}</a>`;
        return `<td class="${cls(p)}${g} ${champHere ? "champ" : ""} ${counts ? "" : "nc"} ${need === "need" ? "needr" : ""}" title="${esc(tip)}">` +
          `${star(i)}${ax(i)}${counts ? "" : `<span class="q">?</span>`}${price}${i.sale ? `<span class="pct">−${i.pct}%</span>` : ""}` +
          `${gap > 0.005 ? ` <span class="abv gap">+${num(gap)}</span>` : ""}${need ? " " + needMark(p.code, need) : ""}${langTag(i, false)}</td>`;
      }).join("") + `</tr>`;
  }
  const row = (label, fn, extra) => `<tr class="${extra || ""}"><td>${label}</td><td></td>${cols.map(p => `<td class="${cls(p)}">${fn(p)}</td>`).join("")}</tr>`;
  h += `</tbody><tfoot>` +
    row("Einkaufspreis", p => `<span title="${esc(costTip(p))}">${p.estimated ? "ca. " : ""}${eur(p.cost)}</span>`, "pay sumtop") +
    row("Preis", p => p.opt_gap === null || p.opt_gap === undefined ? "–" : `${atBest(p.optimum + p.opt_gap, p.optimum) ? `<span class="g-${p.grade || "buy"}"${nearTip(p.opt_gap)}>am Bestpreis</span>` : `<span class="abv">+${eur(p.opt_gap)}</span>`}<small>Bestpreis-Summe ${eur(p.optimum)}</small>`) +
    row("Wechsel", p => {
      if(p.is_ref) return `<span class="mut">Basis</span>`;
      if(p.gain === null || p.gain === undefined) return "–";
      const g = `${p.gain >= 0 ? "spart" : "kostet"} ${eur(Math.abs(p.gain))}`;
      return (p.current ? `Konto hier` : p.worth ? `<b>✓ lohnt</b>` : `<b class="bad">lohnt nicht</b>`) +
        `<small>${g}${p.missing.length ? `, ${p.items.length} von ${S.ui.basket.length} Titeln` : ""}</small>`;
    }) +
    row("Rest", p => p.is_ref ? "0" : restHtml(p, true)) +
    row("Shop", p => money(p.total, p.currency)) +
    row("Karten", p => p.cards.length ? cardsHtml(p) : (p.is_ref ? ((S.state.pay[p.code] || {}).card ? "Guthabenkarten" : "exakter Betrag") : p.via === "card" ? "Kartenzahlung" : "–")) +
    row("Passt dazu", p => {
      const f = p.fillers[0];
      if(!f) return "";
      return `<button class="fl" data-act="add" data-c="${p.code}" data-s="${esc(f.slugs.join(","))}" title="${esc(f.titles.join(" + "))}: Aufpreis ${eur(f.extra)}, ohne den Wechsel ${eur(f.ref)}. Kommt für alle Länder in den Korb.">+ ${f.shorts.map(esc).join(" + ")} <b>spart ${eur(f.gain)}</b></button>`;
    }) +
    row("Hinweise", p => { const c = hurdles(p); return c.length ? c.join("<br>") : ""; }) +
    `</tfoot></table></div>`;
  if(mixWins)
    h += `<p class="restline"><b>Aufgeteilt auf Länder mit Kartenzahlung:</b> ${eur(S.mix.cost)}` +
      (single ? `, das sind ${eur(single.cost - S.mix.cost)} weniger als alles in ${esc(single.name)}` : "") + `. ` +
      S.mix.parts.map(x => `${esc(x.name)} ${eur(x.cost)} (${x.titles.map(esc).join(", ")})`).join(" · ") + `</p>`;
  if(none.length)
    h += `<p class="restline">Korb dort nicht kaufbar: ` + none.map(p => esc(p.name)).join(" · ") + `</p>`;
  return h + hiddenLine();
}

/* ---------- Titel als Tabelle (bisher Preisvergleich) ---------- */
function viewMatrix(){
  const mx = S.state.matrix, q = S.rq.toLowerCase(), f = S.vf || "all";
  const verdictOf = Object.fromEntries(S.state.radar.map(r => [r.slug, r.verdict]));
  const cellEur = (r, code) => { const x = r.cells[code]; return x && !x.na ? x.eur : null; };
  const rows = sortRows("matrix", mx.rows.filter(r => (!q || r.title.toLowerCase().includes(q)) && (f === "all" || verdictOf[r.slug] === f) &&
    (!S.onlySale || Object.values(r.cells).some(c => c.sale))), new Proxy({title: r => r.title, best: r => r.champ ? r.champ.eur : null},
    {get: (o, k) => o[k] || (r => cellEur(r, k))}));
  // Mit „nur Angebote“ fallen auch Länder ohne ein Angebot in den gezeigten Zeilen weg
  let cols = S.onlySale ? mx.cols.filter(c => rows.some(r => r.cells[c.code] && r.cells[c.code].sale)) : mx.cols;
  // Spalten nach Wechselstufe; Länder, in denen gerade nichts zählt (ohne Karte), ans Ende
  const dead = c => rows.length && rows.every(r => !r.cells[c.code] || r.cells[c.code].na || r.cells[c.code].nocard);
  const tierOf = c => c.code === "DE" ? 0 : c.tier;
  // Bestpreise je Land in den gezeigten Zeilen. Deutschland bleibt vorn.
  const bests = Object.fromEntries(cols.map(c => [c.code, rows.filter(r => r.champ && r.champ.code === c.code).length]));
  const byBest = (a, b) => (b.code === "DE") - (a.code === "DE") || bests[b.code] - bests[a.code];
  cols = [...cols].sort(S.colOrder === "best" ? (a, b) => (dead(a) - dead(b)) || byBest(a, b)
    : S.colOrder === "tier" ? (a, b) => (dead(a) - dead(b)) || (tierOf(a) - tierOf(b))
    : (a, b) => (dead(a) - dead(b)) || (tierOf(a) - tierOf(b)) || byBest(a, b));
  const groups = [];
  for(const c of cols){
    const g = dead(c) ? "zählt gerade nicht" : S.colOrder === "best" ? (c.code === "DE" ? "" : "nach Bestpreisen") : TIER[Math.max(1, tierOf(c))];
    if(groups.length && groups[groups.length - 1][0] === g) groups[groups.length - 1][1]++; else groups.push([g, 1]);
  }
  const det = !!S.mDetails;
  // Reihenfolge wie in allen Reitern: Suche, Sortierung, Filter, rechts die Ansicht (0.60)
  let h = `<div class="tools"><input type="search" id="rq" placeholder="Titel filtern" value="${esc(S.rq)}">
    <select class="srt" data-act="colorder" title="Reihenfolge der Länderspalten">${[["tierbest", "Länder nach Stufe, darin Bestpreise"], ["best", "Länder nach Bestpreisen"], ["tier", "Länder nach Stufe"]].map(([v, l]) => `<option value="${v}" ${S.colOrder === v ? "selected" : ""}>${l}</option>`).join("")}</select>${titleFilterBar()}
    <label><input type="checkbox" data-act="onlysale" ${S.onlySale ? "checked" : ""}> nur Angebote</label>
    <label title="Landestief, Angebotsende und Sprache in jeder Zelle"><input type="checkbox" data-act="mdet" ${det ? "checked" : ""}> Details</label>${viewSeg()}</div>
    <div class="matrix scroll fitbox ${det ? "" : "compact"}"><table><thead><tr class="grp"><th></th><th></th>${groups.map(([g, n]) => `<th colspan="${n}">${g}</th>`).join("")}</tr>
    <tr>${sth("matrix", "title", "Titel")}${sth("matrix", "best", "Bestpreis", "Niedrigster Einkaufspreis der letzten 24 Monate über alle zählenden Länder. Das Land ist in der Zeile gold umrandet.")}${cols.map(c => sth("matrix", c.code, `${c.code}${bests[c.code] ? `<small class="bc">${bests[c.code]}★</small>` : ""}`, `${c.name} · ${bests[c.code] === 1 ? "1 Bestpreis" : `${bests[c.code]} Bestpreise`} in den gezeigten Titeln`)).join("")}</tr></thead><tbody>`;
  h += rows.map(r => `<tr><td><button class="tbtn" data-act="gotitle" data-s="${esc(r.slug)}" title="Einzelheiten in der Liste">${r.dlc_of ? `<span class="dlc">DLC</span>` : ""}${esc(r.title)}</button>${r.no_ids ? ` <small class="hint">nicht im eShop gefunden</small>` : ""}</td>` +
    `<td class="bp">${r.champ ? `${ax(r.champ)}<b>${eur(r.champ.eur)}</b> <small style="display:inline">${r.champ.code}</small>` : `<span class="mut">–</span>`}${det && r.typical ? `<small title="Typischer Angebotspreis in ${esc(country(r.typical.code).name)}, aus ${r.typical.runs} Angeboten der letzten zwei Jahre">typisch ${ax(r.typical)}${eur(r.typical.eur)}</small>` : ""}</td>` +
    cols.map(c => {
      const x = r.cells[c.code];
      if(!x) return `<td class="mut"></td>`;
      if(x.na) return `<td class="mut" ${x.nolang ? `title="Hier gibt es keine deutsche Fassung"` : ""}>${x.nolang ? "ohne DE" : "–"}</td>`;
      const champ = r.champ && r.champ.code === c.code;
      const counts = !x.nocard && x.lang !== "unknown";
      const g = counts && x.sale && x.grade && x.grade !== "wait" ? "c-" + x.grade : "";
      const tip = compose(c.code, x) + (champ ? " · Hier gab es den Bestpreis" : "") +
        (x.lang === "unknown" ? " · Sprache ungeprüft: zählt nicht" : "") + (x.nocard ? " · ohne Guthabenkarte mit Preis: zählt nicht" : "") +
        (needsRegion(r.dlc_of, c.code, r.slug) ? " · " + needTip(c.code, needsRegion(r.dlc_of, c.code, r.slug)) : "") + (x.low_eur !== null && x.low_eur !== undefined ? ` · Landestief ${eur(x.low_eur)}` : "") + (x.sale && x.end ? ` · Angebot bis ${dm(x.end)}` : "");
      return `<td class="${g} ${champ ? "champ" : ""} ${counts ? "" : "nc"} ${needsRegion(r.dlc_of, c.code, r.slug) === "need" ? "needr" : ""}" title="${esc(tip)}">${star(x)}${ax(x)}${counts ? "" : `<span class="q">?</span>`}${priceLink(r.slug, c.code, num(x.eur), x, c.currency)}${x.sale ? `<span class="pct">−${x.pct}%</span>` : ""}${langTag(x, false)}` +
        (det ? `<small>Landestief ${x.low_eur === null || x.low_eur === undefined ? "?" : eur(x.low_eur)}</small>${x.sale && x.end ? `<small>${endCell(x.end, "bis ")}</small>` : ""}${x.nocard ? `<small>ohne Karte</small>` : x.lang === "unknown" ? `<small><button class="link" data-act="gotitle" data-s="${esc(r.slug)}">Sprache?</button></small>` : ""}` : "") + `</td>`;
    }).join("") + `</tr>`).join("");
  if(!rows.length) h += `<tr><td colspan="${cols.length + 2}" class="mut">Kein Titel passt zum Filter.</td></tr>`;
  return h + `</tbody></table></div><p class="hint" style="margin-top:6px">Zellfarbe für Angebote: dunkelgrün „kaufen“, hellgrün „gut“. Gold umrandet: hier gab es den Bestpreis. <span class="q">?</span> zählt nicht. Ein Klick auf den Preis öffnet den Verlauf bei DekuDeals, auf den Titel die Einzelheiten.</p>`;
}
function viewSeg(){
  return `<span class="seg"><button data-act="tview" data-v="list" class="${S.tview === "table" ? "" : "on"}">Liste</button><button data-act="tview" data-v="table" class="${S.tview === "table" ? "on" : ""}">Tabelle</button></span>`;
}

/* ---------- Preisverlauf aus der eigenen Aufzeichnung ---------- */
const LINE_COLORS = ["#0d6b4f", "#c2410c", "#2563eb", "#9333ea", "#b45309", "#0891b2", "#be185d", "#4d7c0f", "#64748b", "#a16207", "#7c3aed"];
const dmy = iso => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleDateString("de-DE", {day:"2-digit", month:"2-digit", year:"numeric"}); };
const dm = iso => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleDateString("de-DE", {day:"2-digit", month:"2-digit"}); };
async function openVerlauf(slug){
  const v = await api("/api/verlauf?slug=" + encodeURIComponent(slug));
  // Sichtbar: Deutschland und jedes Land, in dem es ein Angebot gab
  S.vl = {data: v, show: new Set(v.countries.filter(c => c.code === "DE" || c.sale_count).map(c => c.code))};
  drawVerlauf();
  const d = $("verlauf");
  if(!d.open) d.showModal();
}
function drawVerlauf(){
  const v = S.vl.data, d = $("verlauf");
  const color = code => code === "DE" ? "var(--ink)" : LINE_COLORS[v.countries.findIndex(c => c.code === code) % LINE_COLORS.length];
  let h = `<header><h2>${esc(v.title)}</h2><a class="mini" href="/api/fall?slug=${encodeURIComponent(v.slug)}" download="fall-${esc(v.slug)}.json" title="Alle Daten dieses Titels als Datei (Preise, Tiefstwerte, Verlauf, Karten, Kurse, Einstellungen ohne Wishlist-Link). Schickst du sie mir, kann ich deinen Fall genau nachrechnen.">Fall exportieren</a><button data-act="vlclose">Schließen</button></header>`;
  if(!v.countries.length){
    d.innerHTML = h + `<p class="hint">Noch keine Aufzeichnung für diesen Titel. Jeder Abgleich hält fest, wenn sich ein Preis ändert.</p>`;
    return;
  }
  const days = Math.max(0, (new Date(v.now) - new Date(v.since)) / 864e5);
  h += `<p class="hint">Aufgezeichnet seit ${dmy(v.since)} (${Math.round(days)} ${Math.round(days) === 1 ? "Tag" : "Tage"}). Europreise zum heutigen Kurs und Zahlweg, damit Länder und Zeitpunkte vergleichbar sind. Die Aufzeichnung kennt nur Zeiten, in denen das Tool lief.${days < 30 ? " Noch wenig Daten: Die Kurven werden mit jedem Abgleich aussagekräftiger." : ""}</p>`;
  h += `<div class="lg">` + v.countries.map(c => `<button class="${S.vl.show.has(c.code) ? "" : "off"}" data-act="vltoggle" data-c="${c.code}" title="ein- oder ausblenden"><i style="background:${color(c.code)}"></i>${esc(c.name)}</button>`).join("") + `</div>`;
  h += chartSvg(v, color);
  const V = "verlauf", vrows = sortRows(V, v.countries, {name: c => c.name, now: c => c.now_eur, regular: c => c.regular_eur,
    low: c => c.low_eur, sales: c => c.deku_sales ?? c.sale_count, days: c => c.typical_days, pct: c => c.on_sale_pct,
    last: c => { const l = c.sales[c.sales.length - 1]; return l ? -new Date(l.start) : null; }});
  h += `<div class="scroll"><table><thead><tr>${sth(V, "name", "Land")}${sth(V, "now", "jetzt")}${sth(V, "regular", "normal")}${sth(V, "low", "tiefster", "Niedrigster aufgezeichneter Preis")}${sth(V, "sales", "Angebote", "Angebote der letzten 24 Monate laut DekuDeals. Fehlt diese Angabe: wie oft der Titel in der eigenen Aufzeichnung unter dem heutigen Normalpreis lag")}${sth(V, "days", "Dauer", "Mittlere Dauer der abgeschlossenen Angebote")}${sth(V, "pct", "im Angebot", "Anteil der aufgezeichneten Zeit im Angebot")}${sth(V, "last", "zuletzt")}</tr></thead><tbody>` +
    vrows.map(c => {
      const a = c.est ? APPROX : "", last = c.sales[c.sales.length - 1];
      const lastTxt = !last ? "–" : last.end ? `${dm(last.start)}–${dm(last.end)}<small>−${last.pct} %, ${a}${eur(last.low_eur)}</small>` : `läuft seit ${dm(last.start)}<small>−${last.pct} %, ${a}${eur(last.low_eur)}</small>`;
      return `<tr><td>${esc(c.name)}</td><td>${c.now_eur === null ? "–" : a + eur(c.now_eur)}</td><td>${a}${eur(c.regular_eur)}</td>
        <td>${a}${eur(c.low_eur)}<small>${c.currency === "EUR" ? "" : money(c.low, c.currency) + " · "}${dm(c.low_at)}</small></td>
        <td>${c.deku_sales !== null && c.deku_sales !== undefined ? `${c.deku_sales}<small>24 Monate</small>` : `${c.sale_count}<small>aufgezeichnet</small>`}</td><td>${c.typical_days === null ? "–" : String(c.typical_days).replace(".", ",") + " T."}</td><td>${c.on_sale_pct} %</td><td>${lastTxt}</td></tr>`;
    }).join("") + `</tbody></table></div>`;
  d.innerHTML = h;
}
function chartSvg(v, color){
  // Breite nach Bildschirm, damit die Schrift auch auf dem Handy lesbar bleibt
  const W = Math.max(320, Math.min(860, window.innerWidth - 70)), H = W < 600 ? 220 : 260, L = 44, R = 10, T = 12, B = 26;
  const shown = v.countries.filter(c => S.vl.show.has(c.code));
  const t0 = +new Date(v.since), t1 = Math.max(+new Date(v.now), t0 + 864e5);
  const refs = [];
  if(v.champ) refs.push({y: v.champ.eur, label: "Bestpreis", col: "var(--gold)"});
  if(v.typical) refs.push({y: v.typical.eur, label: "typisch", col: "var(--muted)"});
  if(v.target !== null && v.target !== undefined) refs.push({y: v.target, label: "Ziel", col: "var(--accent)"});
  const top = Math.max(1, ...shown.map(c => Math.max(c.regular_eur, ...c.points.map(p => p[2]))), ...refs.map(r => r.y)) * 1.08;
  const x = t => L + (W - L - R) * (t - t0) / (t1 - t0), y = e => T + (H - T - B) * (1 - e / top);
  let g = "";
  const step = top > 40 ? 10 : top > 16 ? 5 : top > 6 ? 2 : 1;
  for(let e = 0; e <= top; e += step) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(e)}" y2="${y(e)}"/><text x="${L - 6}" y="${y(e) + 4}" text-anchor="end">${e} €</text>`;
  const ticks = W < 600 ? 3 : 5;
  for(let i = 0; i <= ticks; i++){
    const t = t0 + (t1 - t0) * i / ticks;
    g += `<text x="${x(t)}" y="${H - 8}" text-anchor="${i === 0 ? "start" : i === ticks ? "end" : "middle"}">${dm(new Date(t).toISOString())}</text>`;
  }
  for(const r of refs) g += `<line class="ref" x1="${L}" x2="${W - R}" y1="${y(r.y)}" y2="${y(r.y)}" style="stroke:${r.col}"><title>${esc(r.label)}: ${eur(r.y)}</title></line><text x="${W - R}" y="${y(r.y) - 4}" text-anchor="end" style="fill:${r.col}">${esc(r.label)} ${eur(r.y)}</text>`;
  for(const c of shown){
    const pts = c.points, col = color(c.code);
    let p = `M${x(+new Date(pts[0][0]))},${y(pts[0][2])}`;
    for(let i = 1; i < pts.length; i++) p += `H${x(+new Date(pts[i][0]))}V${y(pts[i][2])}`;
    p += `H${x(t1)}`;
    g += `<path class="ln" d="${p}" style="stroke:${col}"${c.code === "DE" ? ` stroke-dasharray="6 4"` : ""}/>`;
    g += pts.map(q => `<circle cx="${x(+new Date(q[0]))}" cy="${y(q[2])}" r="3.5" style="fill:${col}"><title>${esc(c.name)} ${dmy(q[0])}: ${c.currency === "EUR" ? "" : money(q[1], c.currency) + ", "}${c.est ? "ca. " : ""}${eur(q[2])}</title></circle>`).join("");
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Preisverlauf in Euro">${g}</svg>`;
}

/* ---------- Einstellungen: jede Änderung wird sofort gespeichert ---------- */
function cardInfo(text){
  let n = 0, out = 0;
  for(const line of (text || "").split(/[\n;]+/)){
    const t = line.trim();
    if(!t) continue;
    const off = /^(?:[x#!\-]\s+|\(aus\))/i.test(t);
    const body = t.replace(/^(?:[x#!\-]\s+|\(aus\)\s*)/i, "").replace(/https?:\/\/\S+/g, "").replace(/\s*=\s*/g, "=");
    const parts = (t.includes("|") || /https?:/i.test(t)) ? [body.split("|")[0]] : body.split(/\s+/);
    for(const p of parts) if(/\d/.test(p)){ n++; if(off) out++; }
  }
  return n ? `${n} ${n === 1 ? "Karte" : "Karten"} erkannt${out ? `, ${out} nicht vorrätig` : ""}` : "keine Karten eingetragen";
}
/* Spalte „Dein Faktor“: was 1 € Guthaben dort kostet, mit Zahlweg und Bewertung (0.53) */
function faktorCell(pi){
  const k = pi.card, est = pi.via === "giftcard" && !k && !pi.at_rate;
  const tip = pi.via === "card" ? `Kreditkarte: Mittelkurs plus ${pctTxt(pi.fee)} Gebühr` :
    k ? `Karte ${money(k.face, pi.currency)} (Wert ${eur(k.value)}) für ${eur(k.cost)}${k.live ? `, Shop-Preis vom ${stamp(k.live)}` : ", dein eingetragener Preis"}` :
    pi.via === "eur" ? "kein Guthaben unter Nennwert eingetragen" :
    pi.at_rate ? "Guthaben zum Kurs (Werte ohne Link)" : "geschätzt: kein Kartenpreis bekannt, entscheidet nichts";
  const how = pi.via === "card" ? "Kreditkarte" : pi.via === "eur" ? "Shop-Preis" : est ? "geschätzt" : "Guthaben";
  const r = pi.rating && pi.rating.level && !["cheaper", "same", "dearer"].includes(pi.rating.level) ? pi.rating.text.split(",")[0] : "";
  return `<span title="${esc(tip)} · 1 € = ${(1 / pi.unit).toLocaleString("de-DE", {maximumFractionDigits: 3})} ${esc(pi.currency)}" class="${pi.factor < 1 ? "lvl-neg" : "lvl-pos"}">${est ? "≈ " : ""}${fac(pi.factor)}</span> <small class="hint">${how}${r ? `, ${esc(r)}` : ""}</small>`;
}

function langDe(text){

async function saveSettings(form, rerender){
  const active = () => JSON.stringify(Object.entries(S.state.settings.countries).filter(e => e[1].enabled).map(e => e[0]));
