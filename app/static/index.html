<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eShop-Kompass</title>
<style>
:root{
  --bg:#f4f2ec; --card:#fffdf8; --ink:#1d2320; --muted:#667069; --line:#dcd8cc;
  --accent:#0d6b4f; --warn:#8a5a00; --warn-bg:#fbefd2;
  --sale:#b3261e; --best:#e3f3ea; --chip:#ece9df; --gold:#d99a00; --gold-ink:#2b2000;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#141816; --card:#1c211f; --ink:#e7ebe8; --muted:#97a19b; --line:#2e3532;
  --accent:#5fd0a5; --warn:#f0c36a; --warn-bg:#3a2e12;
  --sale:#ff8a80; --best:#183328; --chip:#262c29; --gold:#f2c14e; --gold-ink:#2b2000;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{padding:0 16px 60px}
.narrow{max-width:1280px}
header.top{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:14px 0 6px}
header.top h1{font-size:19px;margin:0;letter-spacing:-.01em}
header.top .meta{color:var(--muted);font-size:13px;flex:1;min-width:200px}
button,select,input{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
button.link{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline}
button:disabled{opacity:.5;cursor:default}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:10px;overflow-x:auto}
nav button{white-space:nowrap}
a.btn{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;color:var(--ink);text-decoration:none}
a.btn:hover{border-color:var(--accent)}
nav button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:6px 12px;color:var(--muted)}
nav button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:9px 12px;margin-bottom:10px}
.hint{color:var(--muted);font-size:13px;margin:0}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;text-align:right;padding:6px 8px}
td{padding:6px 8px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
.scroll{overflow-x:auto}
.pct{color:var(--sale);font-size:11px;margin-left:3px}
.pct.m-low{background:var(--accent);color:var(--card);border-radius:4px;padding:0 2px;font-weight:600}
.pct.m-best{background:var(--gold);color:var(--gold-ink);border-radius:4px;padding:0 2px;font-weight:700}
.pct.m-best_easy{box-shadow:inset 0 0 0 1.5px var(--gold);color:var(--ink);border-radius:4px;padding:0 2px;font-weight:600}
.gap{color:var(--muted);font-size:11px;margin-left:3px}
.approx{color:var(--warn);margin-right:2px;cursor:help}
.warnc{color:var(--warn)}
.today{color:var(--sale);font-weight:700}
.ok{color:var(--accent);font-weight:600}
.lgt{font-size:10px;font-weight:700;border-radius:3px;padding:0 3px;margin-left:4px;vertical-align:1px;white-space:nowrap}
.lgt.de{background:var(--best);color:var(--accent)}
.lgt.no{background:var(--warn-bg);color:var(--warn)}
.matrix td.champ{box-shadow:inset 0 0 0 2px var(--gold)}
.matrix td.bp{white-space:nowrap}
.pc .save.near{color:var(--gold)}
.pc .line .cost{font-size:16px}
.bad{color:var(--warn);font-weight:600}
.over{color:var(--sale)}
.dlc.has{border-color:var(--accent);color:var(--accent)}
.dlc.own{border-color:var(--warn);color:var(--warn)}
.dlc{font-size:9px;border:1px solid var(--line);border-radius:3px;padding:0 3px;margin-right:4px;color:var(--muted);vertical-align:1px}
a.pl{color:inherit;text-decoration:none}
a.pl:hover{text-decoration:underline;text-decoration-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.chip{font-size:11px;border-radius:999px;padding:0 7px;background:var(--chip);color:var(--muted);white-space:nowrap}
.chip.w{background:var(--warn-bg);color:var(--warn)}

/* Leiste über den Paketen */
.bar{display:flex;flex-wrap:wrap;gap:5px 8px;align-items:center;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:6px 10px;margin-bottom:10px;font-size:13px}
.bar.on{border-color:var(--accent)}
.bar .sp{flex:1}
.bar select{max-width:230px;font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:2px 4px}
.bar button{padding:2px 9px;font-size:12px;border-radius:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;background:none;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--bg);font-weight:600}
.legend .pct{margin:0 3px 0 8px}

/* Länderkarten: Raster (dicht) und Liste (groß) */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:10px;align-items:start}
.pc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px 8px;font-size:13px;line-height:1.35;min-width:0}
.pc.cur{border-color:var(--accent)}
.pc>header{display:flex;align-items:baseline;justify-content:space-between;gap:7px}
.pc h2{font-size:15px;margin:0;white-space:nowrap}
.pc .sub{color:var(--muted);font-size:11.5px;margin:0}
.pc .save{font-size:17px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.pc .save small{font-size:11px;font-weight:500;margin-left:2px}
.pc .save.low{color:var(--muted)}
.pc .save.neg{color:var(--sale)}
.pc .line{margin:1px 0 5px;font-variant-numeric:tabular-nums}
.pc .line i{font-style:normal;color:var(--muted);margin:0 5px}
.pc .line small{color:var(--muted)}
.pc table{table-layout:fixed}
.pc th{padding:1px 3px;font-size:10px}
.pc td{padding:2px 3px;font-size:12.5px;vertical-align:top}
.pc td.t{white-space:normal;font-size:13px;line-height:1.25}
.tt{display:flex;gap:5px;align-items:flex-start}
.tt input{margin:2px 0 0;flex:none}
.tt .nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.pc col.c-l{width:88px}.pc col.c-b{width:52px}.pc col.c-e{width:44px}.pc col.c-d{width:44px}
.pc .c-t{display:none}
.soon{color:var(--warn);font-weight:600}
.sugg{display:flex;flex-direction:column;gap:2px;margin-top:5px}
.sugg button{display:flex;gap:7px;align-items:baseline;text-align:left;border:0;background:var(--bg);border-radius:6px;
  padding:2px 7px;font-size:12px;width:100%;font-variant-numeric:tabular-nums}
.sugg button:hover{outline:1px solid var(--accent)}
.sugg .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:60px}
.sugg small{color:var(--muted);white-space:nowrap}
.sugg b{color:var(--accent);white-space:nowrap}
.foot{display:flex;gap:6px;align-items:center;margin-top:6px}
.foot button{padding:1px 8px;font-size:12px;border-radius:6px;white-space:nowrap}
.foot select{flex:1;min-width:0;font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1px 4px}
.restline{margin:10px 2px 0;color:var(--muted);font-size:13px}

.grid.list{grid-template-columns:1fr;max-width:1000px;gap:12px}
.list .pc{font-size:14.5px;padding:14px 18px 12px}
.list .pc h2{font-size:18px}
.list .pc .sub{font-size:12.5px}
.list .pc .save{font-size:23px}
.list .pc .save small{font-size:12px}
.list .pc .line{margin:4px 0 8px}
.list .pc td{font-size:14px;padding:5px 6px}
.list .pc th{font-size:11px;padding:3px 6px}
.list .pc td.t{font-size:14.5px}
.list .tt .nm{display:block}
.list .pc col.c-l{width:140px}.list .pc col.c-b{width:70px}.list .pc col.c-e{width:80px}.list .pc col.c-d{width:80px}
.list .pc .c-t{display:table-cell}
.list .pc col.c-t{display:table-column;width:110px}
.list .pct{font-size:12px}
.list .sugg button{font-size:13.5px;padding:5px 10px}
.list .foot button,.list .foot select{font-size:13px;padding:3px 9px}
.list .chip{font-size:12px}

/* Vergleichstabelle für den gemeinsamen Korb */
.cmp{background:var(--card);border:1px solid var(--line);border-radius:10px;font-size:13px}
.cmp table{width:auto;min-width:100%}
.cmp th,.cmp td{padding:4px 8px;vertical-align:top;min-width:96px}
.cmp tfoot td{white-space:normal}
.cmp tfoot tr.pay td,.cmp tfoot tr.sumtop td{white-space:nowrap}
.cmp thead th{font-size:13px;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:700;vertical-align:bottom}
.cmp thead th small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.cmp td:first-child,.cmp th:first-child{position:sticky;left:0;background:var(--card);min-width:210px;max-width:260px;white-space:normal;z-index:1}
.cmp td small{display:block;color:var(--muted);font-size:11px}
.pc td.t small{display:block;font-size:11px}
.cmp td.na{color:var(--muted)}
.cmp .win{background:var(--best)}
.cmp thead th.win{box-shadow:inset 0 3px 0 var(--accent)}
.cmp .rb b{text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px}
.cmp tr.sumtop td{border-top:2px solid var(--line)}
.cmp tr.pay td{font-size:15px;font-weight:700}
.cmp tfoot td:first-child{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.cmp .incomplete{opacity:.6}
.cmp .x{border:0;background:none;padding:0 6px 0 0;color:var(--muted)}
.cmp .fl{border:0;background:var(--bg);border-radius:6px;padding:1px 6px;font-size:11.5px;white-space:normal;text-align:right}
.cmp .fl b{color:var(--accent);white-space:nowrap}
.cmp .chips{justify-content:flex-end;margin:0}
.tagwin{display:inline-block;background:var(--accent);color:var(--card);border-radius:4px;padding:0 5px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}

/* Preisvergleich */
.tools{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tools input[type=search]{flex:1;min-width:180px;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.matrix{background:var(--card);border:1px solid var(--line);border-radius:10px;font-size:13px}
.matrix td,.matrix th{padding:3px 8px}
.matrix th{position:sticky;top:0;background:var(--card)}
.matrix td:first-child,.matrix th:first-child{position:sticky;left:0;background:var(--card);max-width:280px;white-space:normal}
.matrix td.best{background:var(--best);font-weight:600}
.matrix td.na{color:var(--muted)}
.matrix td small{display:block;color:var(--muted);font-size:10.5px;line-height:1.2}
.star{border:0;background:none;padding:0 6px 0 0;font-size:15px;color:var(--muted)}
.star.on{color:var(--accent)}

/* Einstellungen */
form.set{display:grid;gap:16px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.fields .pair{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
label.f input,label.f select,.set td input[type=text],.set td input[type=number],.set td select{
  background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 9px;color:var(--ink);width:100%}
.set td{text-align:left;vertical-align:middle;padding:4px 8px}
.set th{text-align:left}
.set td input[type=number]{width:90px}
.set td.cards{min-width:230px}
.code{color:var(--muted);font-size:12px;margin-left:4px}
pre.log{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:240px;overflow:auto;font-size:12px;margin:0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;z-index:5}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
@media (max-width:640px){.cmp td:first-child,.cmp th:first-child{min-width:130px;max-width:150px}}
@media (max-width:640px){.list .pc .c-t,.list .pc col.c-t{display:none}.list .pc col.c-l{width:100px}
  .list .pc col.c-b{width:50px}.list .pc col.c-e{width:56px}.list .pc col.c-d{width:56px}}

/* Radar */
.radar{background:var(--card);border:1px solid var(--line);border-radius:10px;font-size:13px}
.radar th,.radar td{padding:4px 9px;vertical-align:top}
.radar thead th{position:sticky;top:0;background:var(--card);z-index:1}
.radar td:first-child{white-space:normal;min-width:200px;max-width:300px}
.radar td small{display:block;color:var(--muted);font-size:11px}
.radar td.na{color:var(--muted)}
.radar tr.v-none td{opacity:.62}
.tgt{width:62px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1px 4px;text-align:right;font-size:12px}
.vd{display:inline-block;border-radius:999px;padding:0 8px;font-size:11.5px;white-space:nowrap}
.vd.buy{background:var(--accent);color:var(--card);font-weight:700}
.vd.good{background:var(--best);color:var(--accent);font-weight:600}
.vd.hard{background:var(--warn-bg);color:var(--warn)}
.vd.wait,.vd.none{background:var(--chip);color:var(--muted)}
.kb{border:1px solid var(--line);background:none;border-radius:6px;padding:0 7px;font-size:12px}
.kb.on{background:var(--accent);border-color:var(--accent);color:var(--card)}
a.tl{color:inherit;text-decoration:none}
a.tl:hover{text-decoration:underline}
a.mini{color:var(--muted);font-size:10px;margin-left:5px;text-decoration:none;border:1px solid var(--line);border-radius:3px;padding:0 3px}
.pc .hide{border:0;background:none;color:var(--muted);padding:0 0 0 6px;font-size:13px}
.bar .srt{font-size:12px}
.toast button{margin-left:10px;border:0;background:none;color:inherit;text-decoration:underline;padding:0;font-weight:700}
.cardsbox{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.cardsbox label{display:grid;gap:3px;font-size:13px}
.cardsbox textarea{font:12px/1.4 ui-monospace,monospace;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:74px;resize:vertical;width:100%}
.cardsbox small{color:var(--muted)}
.saved{color:var(--accent);font-size:13px;margin-left:8px}
h3.sec{margin:22px 0 8px;font-size:14px}
.lvl-neg{color:var(--accent);font-weight:600}
.lvl-pos{color:var(--muted)}
.set td input[type=number].sm{width:64px}
.set td select[data-k=tier]{width:92px}
.set td select[data-k=pay]{width:156px}
dialog.vl{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:16px 18px;width:min(920px,calc(100vw - 32px));max-height:calc(100vh - 40px)}
dialog.vl::backdrop{background:rgba(0,0,0,.35)}
dialog.vl header{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
dialog.vl h2{margin:0;font-size:18px;flex:1}
.vl svg{width:100%;height:auto;display:block;margin:8px 0}
.vl svg text{fill:var(--muted);font-size:11px}
.vl svg .grid{stroke:var(--line);stroke-width:1}
.vl svg .ln{fill:none;stroke-width:2}
.vl svg .ref{stroke-width:1.5;stroke-dasharray:5 4}
.vl .lg{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.vl .lg button{font-size:12px;padding:2px 8px;border-radius:999px}
.vl .lg button.off{opacity:.45}
.vl .lg i{display:inline-block;width:10px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.vl table td:first-child,.vl table th:first-child{text-align:left}
.vl td small{display:block;color:var(--muted);font-size:11px}
button.mini{color:var(--muted);font-size:10px;margin-left:5px;border:1px solid var(--line);border-radius:3px;padding:0 3px;background:none;line-height:1.3}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>eShop-Kompass</h1>
    <div class="meta" id="meta"></div>
    <button class="primary" id="syncBtn" data-act="sync">Aktualisieren</button>
  </header>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<dialog class="vl" id="verlauf"></dialog>
<script>
"use strict";
const S = {state:null, plans:[], ui:null, tab:"radar", filter:"", onlySale:false, rq:"", rOnly:false,
           timer:null, step:"", lastSync:null};
const TABS = [["radar","Radar"],["kauf","Kaufplan"],["plans","Pakete"],["matrix","Preisvergleich"],["settings","Einstellungen"]];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function api(path, body){
  const r = await fetch(path, body === undefined ? {} :
    {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  const j = await r.json();
  if(!r.ok) throw new Error(j.error || r.status);
  return j;
}

/* ---------- Zahlen, Zeiten, Links ---------- */
const DIGITS = {};
function digits(cur){
  if(!(cur in DIGITS)){
    try{ DIGITS[cur] = new Intl.NumberFormat("de-DE",{style:"currency",currency:cur}).resolvedOptions().maximumFractionDigits; }
    catch(e){ DIGITS[cur] = 2; }
  }
  return DIGITS[cur];
}
function money(n, cur){
  if(n === null || n === undefined) return "–";
  try{ return new Intl.NumberFormat("de-DE",{style:"currency",currency:cur||"EUR"}).format(n); }
  catch(e){ return n.toFixed(2).replace(".",",") + " " + (cur||""); }
}
function num(n, cur){   // Zahl ohne Währungszeichen, für enge Spalten
  if(n === null || n === undefined) return "–";
  const d = cur ? digits(cur) : 2;
  return n.toLocaleString("de-DE",{minimumFractionDigits:d, maximumFractionDigits:d});
}
const eur = n => money(n, "EUR");
const APPROX = `<span class="approx" title="geschätzt: Guthaben zum Kurs plus pauschalem Aufschlag, weil für das Land keine Guthabenkarte mit bekanntem Preis eingetragen ist">≈</span>`;
const ax = x => x && x.est ? APPROX : "";   // Kennzeichen für geschätzte Europreise
// Sprachfassung: DE✓ bestätigt (oder dasselbe Produkt wie im deutschen eShop), sonst Hinweis
function langTag(x, all){
  if(!x) return "";
  if(x.lang === "de") return `<span class="lgt de" title="Deutsche Fassung in dieser Region bestätigt">DE✓</span>`;
  if(x.lang === "same" && all) return `<span class="lgt de" title="Dieselbe Fassung wie im deutschen eShop">DE✓</span>`;
  if(x.lang === "no") return `<span class="lgt no" title="Andere Fassung als im deutschen eShop, ohne Deutsch">andere Fassung</span>`;
  return "";
}
function endCell(iso, prefix){
  if(!iso) return "";
  const d = new Date(iso);
  if(isNaN(d)) return "";
  const full = d.toLocaleString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
  const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day(d) - day(new Date())) / 86400000);
  let text = d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"}), cls = "";
  if(diff <= 0){ text = "heute"; cls = "today"; }
  else if(diff === 1){ text = "morgen"; cls = "soon"; }
  else if(diff === 2){ cls = "soon"; }
  return `<span class="${cls}" title="Angebot endet ${esc(full)}">${diff <= 1 ? "" : (prefix || "")}${text}</span>`;
}
function ago(iso){
  if(!iso) return "noch nie";
  const min = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
  if(min < 2) return "gerade eben";
  if(min < 90) return `vor ${min} Min.`;
  if(min < 48 * 60) return `vor ${Math.round(min / 60)} Std.`;
  return `vor ${Math.round(min / 1440)} Tagen`;
}
const clock = d => d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
function toast(msg, undo){
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  if(undo){
    const b = document.createElement("button");
    b.textContent = "Rückgängig";

}
const country = code => S.state.countries.find(c => c.code === code) || {name: code, lang: "en"};
const shopOf = code => code ? (country(code).shop || code) : "DE";   // DG nutzt den deutschen eShop

function shopUrl(code, nsuid){   // Produktseite im eShop des Landes
  if(!nsuid) return null;

/* Landespreis verlinkt den Verlauf bei DekuDeals, der Europreis die eShop-Seite */
function priceLink(slug, code, text, x, cur){
  const tip = (x && x.eur !== undefined && String(text).includes("€") ? compose(code, x) + " · " : "") +
    "Klick öffnet den Preisverlauf bei DekuDeals" + (x && x.low !== null && x.low !== undefined ? ` · Landestief ${money(x.low, cur)}` : "");
  return `<a class="pl" href="${deku(slug, code)}" target="_blank" rel="noopener" title="${esc(tip)}">${text}</a>`;

/* Woraus sich ein Europreis zusammensetzt: Shop-Preis, Steuer, Kurs, Zahlweg */
function compose(code, x){
  const p = S.state.pay[code];
  if(!p || x.eur === null || x.eur === undefined) return "";
  const cur = p.currency, parts = [];
  const net = x.net ?? x.local;
  parts.push(`eShop ${money(net, cur)}` + (p.tax ? ` + ${String(p.tax).replace(".", ",")} % Steuer = ${money(x.local, cur)}` : ""));
  if(p.via === "eur") return parts[0] + ", exakter Betrag";
  if(cur === "EUR" && p.card) return parts.concat(`Guthabenkarte ${eur(p.card.face)} für ${eur(p.card.cost)}${cardSrc(p.card)}, ein Rest bleibt auf dem Konto`).join(" · ") + ` · ergibt ${eur(x.eur)}`;
  parts.push(`Mittelkurs 1 € = ${p.rate.toLocaleString("de-DE", {maximumFractionDigits: p.rate > 20 ? 1 : 3})} ${cur}` +
    (S.state.fx_updated ? ` (Stand ${fxDate()})` : ""));
  if(p.via === "card") parts.push(`Kartenzahlung plus ${pctTxt(p.fee)} Fremdwährungsgebühr, die Bank rechnet mit eigenem Kurs`);
  else if(p.card) parts.push(`Guthabenkarte ${money(p.card.face, cur)} für ${eur(p.card.cost)}${cardSrc(p.card)}, das sind ${p.vs_mid > 0 ? "+" : ""}${pctTxt(p.vs_mid)} zum Kurs`);
  else if(p.at_rate) parts.push(`Guthaben in festen Werten zum Kurs ${p.markup >= 0 ? "+" : ""}${pctTxt(p.markup)}`);
  else parts.push(`Guthaben geschätzt mit Kurs ${p.markup >= 0 ? "+" : ""}${pctTxt(p.markup)}, weil kein Kartenpreis bekannt ist`);
  return parts.join(" · ") + ` · ergibt ${x.est ? "ungefähr " : ""}${eur(x.eur)}` + aloneTxt(x, cur);
}
/* Woher ein Kartenpreis stammt, für Tooltips */
const cardSrc = k => k.market ? ` (günstigster Preis bei gg.deals vom ${stamp(k.market)}, dort mit Shop und Rabattcode)`
  : k.live ? ` (Shop-Preis vom ${stamp(k.live)}${feeTxt(k.fee, k.fee_eur)})` : "";
const feeTxt = (pct, fix) => pct || fix ? ` mit Servicegebühr ${[fix ? eur(fix) : "", pct ? pctTxt(pct) : ""].filter(Boolean).join(" + ")}` : "";
const stamp = sec => new Date(sec * 1000).toLocaleString("de-DE", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"});
/* Gelesene Shop-Preise der Guthabenkarten eines Landes, für die Einstellungen */
function cardStatus(code, cur){
  const rows = (S.state.card_status || {})[code];
  if(!rows) return "";
  const gg = rows.filter(r => r.market), own = rows.filter(r => !r.market && !r.market_error), errs = rows.filter(r => r.market_error);
  const parts = [];
  if(gg.length) parts.push(`gg.deals (${stamp(gg[0].market)}): ` + gg.map(r => `${cur ? money(r.face, cur) : num(r.face)} <span class="ok">${eur(r.cost)}</span>`).join(", "));
  errs.forEach(err => parts.push(`gg.deals: <span class="warnc">${esc(err.market_error)}</span>`));
  return parts.concat(own.map(r => {
    const face = cur ? money(r.face, cur) : num(r.face);
    if(r.live) return `${face}: <span class="ok">${eur(r.cost)}</span> vom Shop (${stamp(r.live)}${feeTxt(S.state.settings.shop_fee_pct, S.state.settings.shop_fee_eur)})`;
    if(r.checked) return `${face}: <span class="warnc">${esc(r.error || "kein Preis")}</span>, es gilt ${r.manual === null ? "Kurs plus Aufschlag" : eur(r.manual)}`;
    return `${face}: wird beim nächsten Abgleich gelesen`;
  })).join(" · ");
}
/* Einzelkauf: welche Karten ein Titel allein braucht und was übrig bleibt */
function aloneTxt(x, cur){
  const a = x.alone;
  if(!a) return "";
  const cards = a.cards.map(c => `${c.count}× ${money(c.face, cur)}`).join(" + ");
  return ` · allein gekauft: ${eur(a.eur)}${cards ? ` (${cards}${a.rest ? `, Rest ${money(a.rest, cur)}` : ""})` : ""}`;
}
const pctTxt = v => String(v ?? "").replace(".", ",") + " %";
function fxStamp(){
  const d = new Date(S.state.fx_updated);
  return isNaN(d) ? (S.state.fx_updated || "–") : d.toLocaleString("de-DE", {day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit"});

function fxDate(){

function buyLink(code, x, text){

function costTip(p){
  if(p.is_ref){
    const c = (S.state.pay[p.code] || {}).card;
    return c ? `Kauf in Deutschland mit Guthabenkarten: ${eur(c.face)} für ${eur(c.cost)}, ein Rest bleibt auf dem Konto` : "Kauf in Deutschland, exakter Betrag";
  }
  const info = S.state.pay[p.code] || {};
  if(p.via === "card") return `Per Karte: ${money(p.total, p.currency)} zum Mittelkurs plus ${pctTxt(info.fee)} Gebühr. Die Abrechnung deiner Bank kann leicht abweichen.`;
  if(p.estimated) return `Geschätzt: ${money(p.total, p.currency)} zum Kurs ${info.markup >= 0 ? "+" : ""}${String(info.markup ?? "").replace(".", ",")} %, weil keine Guthabenkarten eingetragen sind`;
  const sum = p.cards.reduce((a, c) => a + c.count * c.face, 0);
  return `Guthabenkarten über ${money(sum, p.currency)} für ${eur(p.cost)}` + (p.rest ? `, davon bleiben ${money(p.rest, p.currency)} als Rest` : ", kein Rest");
}

const MARK = {best:"Bestpreis über alle Länder", best_easy:"Bestpreis der leichten Länder", low:"Tiefstpreis dieses Landes", sale:"Angebot über dem Tiefstpreis"};

const gapTag = x => x.sale && x.gap > 0 ? `<span class="gap" title="über dem Bestpreis">+${x.gap} %</span>` : "";
const LEGEND = `<span class="legend hint"><span class="pct m-best">★−50%</span>Bestpreis<span class="pct m-best_easy">☆−50%</span>Bestpreis leicht<span class="pct m-low">−50%</span>Landestief<span class="pct m-sale">−50%</span>Angebot darüber<span class="approx" style="margin-left:8px">≈</span>geschätzt</span>`;
function chipsFor(p){
  const out = [];
  for(const w of p.warnings){
    if(w.startsWith("Rest blockiert")) out.push(`<span class="chip w" title="${esc(w)}, bis das Guthaben 0 ist">Rest blockiert Wechsel</span>`);
    else if(w.startsWith("Keine Guthabenkarten")) out.push(`<span class="chip w" title="${esc(w)}">Karten fehlen</span>`);
    else if(w.startsWith("DLC braucht")) out.push(`<span class="chip" title="${esc(w)}">DLC: Region ${esc(p.family)}</span>`);
    else if(/ohne deutschen Vergleichspreis/.test(w)) out.push(`<span class="chip" title="${esc(w)}">${parseInt(w)} ohne DE-Preis</span>`);
    else if(/ungeprüfter Sprache/.test(w)) out.push(`<span class="chip" title="Für diese Region liegt noch keine Sprachangabe von Nintendo vor">${parseInt(w)}× Sprache ungeprüft</span>`);
    else out.push(`<span class="chip w">${esc(w)}</span>`);
  }
  if(p.tax) out.push(`<span class="chip" title="Der Shop zeigt Preise ohne Steuer, hier sind ${p.tax} % aufgeschlagen">inkl. ${String(p.tax).replace(".", ",")} % Steuer</span>`);
  if(p.note && !p.is_ref) out.push(`<span class="chip">${esc(p.note)}</span>`);
  return out;
}

const planBody = () => ({overrides:S.ui.overrides, must:[], basket:S.ui.basket || []});
function saveUi(){ return api("/api/ui", S.ui).catch(err => toast("Nicht gespeichert: " + err.message)); }
function migrateLocal(){   // frühere Versionen merkten sich den Korb im Browser
  try{
    const b = JSON.parse(localStorage.getItem("ek.basket") || "null");
    const o = JSON.parse(localStorage.getItem("ek.overrides") || "null");

      if(Array.isArray(b) && b.length) S.ui.basket = b;
      if(o) S.ui.overrides = o;

}
async function refresh(){
  S.state = await api("/api/state");

function watch(){

    const st = await api("/api/status");
    const stepChanged = st.step !== S.step;

      clearInterval(S.timer); S.timer = null;
      try{ await refresh(); }catch(e){ toast("Fehler beim Neuladen: " + e.message); }
      toast(st.ok ? "Abgleich fertig" : "Abgleich fehlgeschlagen");
    }

/* Protokoll: neueste Zeile unten, die Box folgt ihr, solange du nicht hochgescrollt hast */
/* Der Server schreibt UTC, angezeigt wird die Uhrzeit deines Browsers */
function localStamp(line){
  const m = /^(\d\d):(\d\d):(\d\d)( .*)$/s.exec(line);
  if(!m) return line;
  const d = new Date(); d.setUTCHours(+m[1], +m[2], +m[3], 0);
  return d.toLocaleTimeString("de-DE") + m[4];
}
function showLog(lines){
  const l = $("log");
  if(!l) return;
  const atEnd = l.scrollHeight - l.scrollTop - l.clientHeight < 30;
  const st = S.state.status || {};
  const head = st.started ? `Abgleich vom ${new Date(st.started).toLocaleString("de-DE")}${st.running ? ", läuft" : st.ok === false ? ", fehlgeschlagen" : ""}\n` : "";
  l.textContent = (lines || []).length ? head + lines.map(localStamp).join("\n") : "Noch kein Protokoll seit dem letzten Neustart.";
  if(atEnd || !l.dataset.seen){ l.scrollTop = l.scrollHeight; l.dataset.seen = "1"; }
}
function renderHead(){
  const st = S.state.status, hours = S.state.settings.refresh_hours || 6;
  const m = $("meta");
  if(st.running){
    m.textContent = `${st.step}${st.total ? ` (${st.done}/${st.total})` : ""} …`;
  } else {
    const last = S.state.last_sync ? new Date(S.state.last_sync) : null;
    const stale = last && Date.now() - last > 2 * hours * 3600000;
    const next = last ? new Date(+last + hours * 3600000) : null;
    m.innerHTML = `<span class="${stale ? "warnc" : ""}" title="${last ? esc(last.toLocaleString("de-DE")) : ""}">Stand ${ago(S.state.last_sync)}</span>` +
      (next ? ` · nächster Abgleich ${next < new Date() ? "in Kürze" : "ca. " + clock(next)}` : "") +
      ` · ${S.state.item_count} Titel · v${esc(S.state.version)}`;
  }
  $("syncBtn").disabled = st.running;
  $("nav").innerHTML = TABS.map(([k,l]) =>
    `<button data-act="tab" data-tab="${k}" class="${S.tab===k?"on":""}">${l}</button>`).join("");
}

      <td>${r.de === null ? `<span class="na">–</span>` : eur(r.de)}</td>
      <td>${(() => {
        // Leeres Ziel: der Bestpreis der leicht erreichbaren Länder als Vorschlag, ein Klick übernimmt ihn
        // Nur sinnvoll, wenn der Bestpreis unter dem Preis jetzt liegt; sonst wäre das Ziel sofort erreicht
        const ce = r.champ_easy || r.champ;
        const sug = r.target === null && ce && (!r.easy || ce.eur < r.easy.eur - 0.005) ? ce.eur : null;
        return `<input class="tgt" type="number" step="0.5" min="0" data-act="target" data-s="${esc(r.slug)}" value="${r.target ?? ""}" placeholder="${sug === null ? "–" : num(sug)}">` +
          (sug !== null ? `<button class="mini" data-act="tgtfill" data-s="${esc(r.slug)}" data-v="${sug}" title="Bestpreis ${eur(sug)} als Zielpreis übernehmen">übernehmen</button>` : "") +
          (hit ? ` <span class="ok">✓</span>` : "");
      })()}</td>
      <td><span class="vd ${r.verdict}" title="${esc(r.reason)}">${VERDICT[r.verdict]}</span>${r.verdict !== "none" || (r.lang_unsure || []).length ? `<small>${esc(r.reason)}</small>` : ""}</td>
      <td><button class="kb ${inBasket(r.slug) ? "on" : ""}" data-act="star" data-s="${esc(r.slug)}" title="in den gemeinsamen Korb">${inBasket(r.slug) ? "✓" : "+"}</button></td></tr>`;
  }).join("");
  h += `</tbody></table></div>`;
  if(S.ui.basket) h += `<p class="restline">${S.ui.basket.length} Titel im Korb. <button class="link" data-act="tab" data-tab="plans">Korb in allen Ländern vergleichen</button></p>`;
  return h;
}

/* ---------- Kaufplan: was jetzt wo kaufen ---------- */
function viewKauf(){
  const k = S.kauf;
  if(!k) return `<p class="hint">Kaufplan wird berechnet …</p>`;
  let h = `<div class="bar on"><b>Kaufplan</b><span>${k.count ? `${k.count} Titel in ${k.steps.length} ${k.steps.length === 1 ? "Land" : "Ländern"} für <b>${eur(k.cost)}</b> statt ${eur(k.ref_total)} in Deutschland, <b class="ok">${eur(k.saving)} gespart</b>` : `Gerade steht kein Titel auf „kaufen“${!S.ui.plan_good && k.good_left ? `, aber ${k.good_left} auf „gutes Angebot“: rechts „auch gute Angebote“ anhaken` : ""}.`}</span>
    <span class="sp"></span>
    <label title="Neben „kaufen“ und „nur schwer“ auch Titel mit dem Urteil „gutes Angebot“ einplanen"><input type="checkbox" data-act="plangood" ${S.ui.plan_good ? "checked" : ""}> auch gute Angebote${!S.ui.plan_good && k.good_left ? ` (${k.good_left})` : ""}</label>
    ${k.count ? `<button data-act="plan2basket" title="Alle Titel des Plans als gemeinsamen Korb in allen Ländern vergleichen">als Korb vergleichen</button>` : ""}</div>
    <p class="hint" style="margin-bottom:10px">Jeder Titel liegt im Land, wo er am wenigsten kostet, mit Karten, Rest und Steuer. Ein Land kommt nur in den Plan, wenn sein Paket deine Mindestersparnis für die Wechselstufe schafft. Reihenfolge: zuerst das Land, in dem dein Konto steht, dann leicht, mittel, schwer. Amerika kommt zuletzt, weil ein Rest dort jeden weiteren Wechsel blockiert.</p>`;
  h += `<div class="grid list">` + k.steps.map((p, n) => kaufStep(p, n + 1)).join("") + `</div>`;
  const notes = [];
  if(k.dropped.length) notes.push(`<b>Nicht eingeplant:</b> ` + k.dropped.map(d =>
    `${esc(d.name)} (${esc(d.tier_name)}) spart für ${d.titles.map(esc).join(", ")} nur ${eur(d.saving)}, deine Schwelle ist ${eur(d.threshold)}`).join(" · "));
  if(k.later.length) notes.push(`<b>Lieber warten:</b> ` + k.later.map(l => `${esc(l.title)} (${esc(l.reason)}, lohnt nur in einem Land, dessen Wechsel sich nicht rechnet)`).join(" · "));
  if(k.nowhere.length) notes.push(`<b>Nirgends kaufbar:</b> ${k.nowhere.map(esc).join(", ")}`);
  if(k.bought_waiting.length) notes.push(`<b>Schon gekauft, noch auf der Wishlist:</b> ${k.bought_waiting.map(esc).join(", ")}`);
  if(k.bought.length) notes.push(`<b>Gekauft:</b> ` + k.bought.map(b => `${dmy(b.at)} ${esc(country(b.code).name)}: ${b.titles.map(esc).join(", ")} für ${eur(b.cost)}${b.de !== null && b.de !== undefined ? ` statt ${eur(b.de)}` : ""}${b.rest ? `, Rest ${money(b.rest, b.currency)}` : ""}`).join(" · ")
    + ` · insgesamt ${eur(k.bought_saving)} gespart <button class="link" data-act="unbought" title="Den letzten Kauf zurücknehmen, Land und Guthaben wie vorher">letzten zurücknehmen</button>`);
  return h + notes.map(x => `<p class="restline">${x}</p>`).join("");
}
function kaufStep(p, n){
  const cur = p.currency, save = p.de_now - p.cost;
  const sub = [p.current ? "Konto steht hier" : p.is_ref ? "kein Wechsel nötig, wenn dein Konto in Deutschland steht" : "Wechsel " + p.tier_name,
    {card:"Karte", giftcard:"Guthabenkarte", auto:"Karte oder Guthaben"}[p.pay] || "", p.family].filter(Boolean).join(" · ");
  let h = `<article class="pc ${p.current ? "cur" : ""}"><header><h2>${n}. ${esc(p.name)}</h2>${save > 0.005 ? `<span class="save" title="gegenüber dem Kauf in Deutschland">−${eur(save)}</span>` : ""}</header><p class="sub">${esc(sub)}</p>`;
  const parts = [`${cur === "EUR" ? "" : money(p.total, cur) + " → "}<b title="${esc(costTip(p))}">${p.estimated ? "ca. " : ""}${eur(p.cost)}</b>${p.is_ref ? "" : ` statt ${eur(p.de_now)} in Deutschland`}`];
  if(p.cards.length) parts.push(cardsHtml(p));
  if(!p.is_ref) parts.push(restHtml(p));
  h += `<p class="line">${parts.join("<i>·</i>")} <button class="mini" data-act="bought" data-c="${esc(p.code)}" title="Vermerkt den Kauf: Dein Konto steht danach hier, ein Rest bleibt als Guthaben, die Titel verschwinden aus dem Plan">gekauft</button></p>`;
  const de = !p.is_ref;   // in Deutschland selbst wäre die Spalte doppelt
  h += `<table><colgroup><col><col class="c-l"><col class="c-e"><col class="c-d">${de ? `<col class="c-d">` : ""}</colgroup>
    <thead><tr><th>Titel</th><th title="Preis im eShop des Landes">Shop ${esc(cur || "")}</th><th>bis</th><th title="Was du bezahlst: mit Steuer, Kurs und Kosten fürs Guthaben">€</th>${de ? "<th>DE €</th>" : ""}</tr></thead><tbody>` +
    p.items.map(i => `<tr><td class="t" title="${esc(i.title + " · " + (p.reasons[i.slug] || ""))}"><span class="nm">${i.dlc_of ? `<span class="dlc ${i.parent_owned ? "has" : ""}">DLC</span>` : ""}${esc(i.short)}</span><small class="hint">${esc(p.reasons[i.slug] || "")}</small></td>
      <td>${priceLink(i.slug, p.code, num(i.local, cur), i, cur)}${pctTag(i, cur)}</td><td>${endCell(i.end)}</td>
      <td>${ax(i)}${buyLink(p.code, i, num(i.eur))}</td>${de ? `<td>${num(i.ref)}</td>` : ""}</tr>`).join("") + `</tbody></table>`;
  const f = p.fillers[0];
  if(f) h += `<p class="restline" style="margin-top:6px">Passt dazu: + ${f.shorts.map(esc).join(" + ")} für ${eur(f.extra)} statt ${eur(f.ref)} in Deutschland${f.rest !== null && f.rest !== undefined ? `, Rest dann ${money(f.rest, cur)}` : ""}</p>`;
  const chips = chipsFor(p);
  if(chips.length) h += `<div class="chips">${chips.join("")}</div>`;
  return h + `</article>`;
}

/* ---------- Pakete: Angebote je Land ---------- */
function sortPlans(list){
  const endOf = p => Math.min(Infinity, ...p.items.filter(i => i.end).map(i => +new Date(i.end)));
  const sav = (a, b) => (b.saving ?? -1e9) - (a.saving ?? -1e9);
  const opt = (a, b) => (a.opt_gap ?? 1e9) - (b.opt_gap ?? 1e9) || sav(a, b);
  const by = {optimum: opt, saving: sav, rest: (a, b) => (a.rest_eur ?? 1e9) - (b.rest_eur ?? 1e9) || sav(a, b),
              end: (a, b) => endOf(a) - endOf(b) || sav(a, b), tier: (a, b) => a.tier - b.tier || sav(a, b)}[S.ui.sort] || sav;
  return list.filter(p => !p.is_ref).sort(by).concat(list.filter(p => p.is_ref));
}
function hiddenLine(){
  if(!S.ui.hidden.length) return "";
  return `<p class="restline">Ausgeblendet: ` + S.ui.hidden.map(c =>
    `${esc(country(c).name)} <button class="link" data-act="unhide" data-c="${c}">einblenden</button>`).join(" · ") + `</p>`;
}
function viewCards(){
  const opt = (v, l) => `<option value="${v}" ${S.ui.sort === v ? "selected" : ""}>${l}</option>`;
  let h = `<div class="bar"><b>Angebote je Land</b>
    <span class="seg"><button data-act="dense" data-v="1" class="${S.ui.dense ? "on" : ""}">Raster</button><button data-act="dense" data-v="0" class="${S.ui.dense ? "" : "on"}">Liste</button></span>
    <select class="srt" data-act="sort" title="Reihenfolge der Länder">${opt("optimum","nach Abstand zum Optimum")}${opt("saving","nach Ersparnis gg. DE")}${opt("rest","nach Rest")}${opt("end","nach Angebotsende")}${opt("tier","nach Stufe")}</select>
    ${LEGEND}<span class="sp"></span>
    <span class="hint">„Korb für alle“ vergleicht einen Korb in allen Ländern.</span></div>`;
  const cards = [], empty = [];
  for(const p of sortPlans(S.plans)){
    if(S.ui.hidden.includes(p.code) && !p.is_ref) continue;
    (!p.items.length && !p.fillers.length ? empty : cards).push(p);
  }
  h += `<div class="grid ${S.ui.dense ? "" : "list"}">${cards.map(planCard).join("")}</div>`;
  if(empty.length)
    h += `<p class="restline">Ohne passendes Angebot: ` + empty.map(p =>
      `${esc(p.name)} <small>(${p.rate ? p.available + " kaufbar" : "noch keine Preise"})</small>`).join(" · ") + `</p>`;
  return h + hiddenLine();
}
function cardsHtml(p){
  return p.cards.map(c => {
    const t = `${c.count}× ${num(c.face, p.currency)}`;
    return c.url ? `<a class="pl" href="${esc(c.url)}" target="_blank" rel="noopener" title="Karte kaufen">${t}</a>` : t;
  }).join(" + ");
}
function planCard(p){
  const has = p.items.length > 0, cur = p.currency;
  const payName = p.is_ref ? "Vergleichsbasis" : {card:"Karte", giftcard:"Guthabenkarte", auto:"Karte oder Guthaben"}[p.pay];
  const sub = [p.current ? "aktuelles Land" : null, payName, p.is_ref ? null : "Wechsel " + p.tier_name,
    p.family, `${p.available} kaufbar`].filter(Boolean).join(" · ");
  // Kopfzahl: Abstand zum Optimum, also zu den Bestpreisen der Titel
  let save = "", saveDe = "";
  if(has && p.opt_gap !== null && p.opt_gap !== undefined){
    const at = p.opt_gap < 0.005;
    save = `<span class="save ${at ? "" : p.opt_gap <= 2 * p.opt_known + 0.005 ? "near" : "low"}" title="Abstand zum Optimum: Summe dessen, was jeder Titel hier über seinem Bestpreis liegt (dem niedrigsten Preis, den es je in einem Land gab, zum heutigen Kurs). ${p.opt_at} von ${p.opt_known} Titeln liegen am Bestpreis.">${at ? "Optimum" : "+" + eur(p.opt_gap)}<small>${p.opt_at}/${p.opt_known} am Bestpreis</small></span>`;
  }
  if(has && p.saving !== null){
    const sign = p.saving >= 0 ? "−" : "+";
    saveDe = `<span class="${p.is_ref ? "" : p.saving < 0 ? "bad" : (p.worth ? "ok" : "")}" title="${p.is_ref ? "Angebote in Deutschland gegenüber dem Normalpreis" : p.worth ? "Ersparnis gegenüber Deutschland jetzt, ohne Rest" : `Ersparnis gegenüber Deutschland jetzt, ohne Rest. Unter deiner Schwelle von ${eur(p.threshold)} für die Stufe ${p.tier_name}`}">${sign}${eur(Math.abs(p.saving))} ${p.is_ref ? "gg. normal" : "gg. DE"}</span>`;
  }
  let h = `<article class="pc ${p.current ? "cur" : ""}"><header><h2>${esc(p.name)}</h2><span>${save}${p.is_ref ? "" : `<button class="hide" data-act="hide" data-c="${p.code}" title="Land ausblenden">×</button>`}</span></header><p class="sub">${esc(sub)}</p>`;

  if(has){
    const parts = [`${cur === "EUR" ? "" : money(p.total, cur) + " → "}<b class="cost" title="${esc(costTip(p))}">${p.estimated ? "ca. " : ""}${eur(p.cost)}</b> statt ${eur(p.ref_total)}${p.is_ref ? " normal" : ""}`];
    // Bleibt Guthaben übrig, steckt es im Kartenpreis: zeigen, was die Spiele selbst kosten
    if(!p.is_ref && p.rest_value >= 0.5) parts.push(`<small title="Du zahlst ${eur(p.cost)} für die Karten. ${eur(p.rest_value)} davon bleiben als Rest auf dem Konto; die Spiele selbst kosten ${eur(p.games_cost)}. Die Ersparnis rechnet mit diesem Betrag.">Spiele ${eur(p.games_cost)}</small>`);
    if(saveDe) parts.push(saveDe);
    if(p.cards.length) parts.push(cardsHtml(p));
    if(!p.is_ref) parts.push(restHtml(p));
    if(!p.worth && p.saving >= 0) parts.push(`<small title="Für Länder der Stufe ${esc(p.tier_name)} lohnt der Wechsel bei dir erst ab ${eur(p.threshold)} Ersparnis">unter Schwelle ${eur(p.threshold)}</small>`);
    const stars = p.items.filter(i => i.mark === "best" || i.mark === "best_easy").length;
    if(stars) parts.push(`<small title="${stars} von ${p.items.length} Titeln zum Bestpreis">${stars}× Bestpreis</small>`);
    h += `<p class="line">${parts.join("<i>·</i>")}</p>`;
    h += `<table><colgroup><col><col class="c-l"><col class="c-t"><col class="c-b"><col class="c-e"><col class="c-d"></colgroup>
      <thead><tr><th>Titel</th><th title="Preis im eShop des Landes">Shop ${esc(cur || "")}</th><th class="c-t">Bestpreis €</th><th>bis</th><th title="Was du bezahlst: mit Steuer, Kurs und Kosten fürs Guthaben">€</th><th>${p.is_ref ? "normal" : "DE €"}</th></tr></thead><tbody>` +
    p.items.map(i => {
      const tip = i.title + (i.dlc_of ? ` (DLC zu ${i.dlc_of}${i.parent_owned ? ", Hauptspiel in deiner Sammlung" : ""})` : "") + (i.owned ? " · schon in deiner Sammlung" : "");
      return `<tr><td class="t" title="${esc(tip)}"><label class="tt"><input type="checkbox" checked data-act="drop" data-c="${p.code}" data-s="${esc(i.slug)}"><span class="nm">${i.dlc_of ? `<span class="dlc ${i.parent_owned ? "has" : ""}">DLC</span>` : ""}${i.owned ? `<span class="dlc own">✓</span>` : ""}${esc(i.short)}</span></label></td>
      <td>${priceLink(i.slug, p.code, num(i.local, cur), i, cur)}${pctTag(i, cur)}</td><td class="c-t">${i.champ === null ? "–" : num(i.champ)}${gapTag(i)}</td>
      <td>${endCell(i.end)}</td><td class="${i.over ? "over" : ""}" ${i.over ? `title="hier teurer als in Deutschland"` : ""}>${ax(i)}${buyLink(p.code, i, num(i.eur))}</td><td>${num(i.ref)}</td></tr>`;
    }).join("") + `</tbody></table>`;
  } else {
    h += `<p class="line"><small>Kein Wishlist-Titel im Angebot.</small></p>`;
  }

  const sugg = p.trims.map(t =>
      `<button data-act="trim" data-c="${p.code}" data-s="${esc(t.slug)}" title="Ohne diesen Titel kostet das Paket ${eur(t.marginal)} weniger, in Deutschland kostet er ${eur(t.ref)}">
        <span class="n">− ${esc(t.short)} weglassen</span><small>hier ${num(t.marginal)} statt ${num(t.ref)}${t.rest === null ? "" : ` · Rest ${num(t.rest, cur)}`}</small><b>−${eur(t.gain)}</b></button>`)
    .concat(p.fillers.map(f =>
      `<button data-act="add" data-c="${p.code}" data-s="${esc(f.slugs.join(","))}" title="${esc(f.titles.join(" + "))}: ${esc(money(f.local, cur))}, Aufpreis ${eur(f.extra)} statt ${eur(f.ref)} in Deutschland">
        <span class="n">+ ${f.shorts.map(esc).join(" + ")}</span><small>+${num(f.extra)} statt ${num(f.ref)}${f.rest === null || f.rest === undefined ? "" : ` · Rest ${num(f.rest, cur)}`}</small><b>−${eur(f.gain)}</b></button>`));
  if(sugg.length) h += `<div class="sugg">${sugg.slice(0, S.ui.dense ? 3 : 99).join("")}</div>`;

  const chips = chipsFor(p);
  if(chips.length) h += `<div class="chips">${chips.join("")}</div>`;

  if(p.rate){
    const inPlan = new Set(p.items.map(i => i.slug));
    const opts = p.is_ref ? "" : S.state.matrix.rows.filter(r => r.cells[p.code] && !r.cells[p.code].na && !inPlan.has(r.slug))
      .map(r => `<option value="${esc(r.slug)}">${esc(r.title)} · ${num(r.cells[p.code].local, cur)}</option>`).join("");
    const ov = S.ui.overrides[p.code];
    const changed = ov && ((ov.add||[]).length || (ov.remove||[]).length);
    if(has || opts || changed)
      h += `<div class="foot">${has ? `<button data-act="share" data-c="${p.code}" title="Diesen Warenkorb in allen Ländern vergleichen">Korb für alle</button>` : ""}
        ${opts ? `<select data-act="pick" data-c="${p.code}"><option value="">Titel hinzufügen …</option>${opts}</select>` : ""}
        ${changed ? `<button class="link" data-act="reset" data-c="${p.code}">zurücksetzen</button>` : ""}</div>`;
  }
  return h + `</article>`;
}
function restHtml(p, bare){
  const pre = bare ? "" : "Rest ";
  if(p.rest === null) return `<span class="bad">${bare ? "unbekannt" : "Rest unbekannt"}</span>`;
  if(p.rest === 0) return `<span class="ok">${pre}0</span>`;
  const blocked = p.warnings.some(w => w.startsWith("Rest blockiert"));
  return `<span class="${blocked ? "bad" : ""}">${pre}${money(p.rest, p.currency)}</span> <small>${eur(p.rest_eur)}</small>`;
}

/* ---------- Pakete: gemeinsamer Korb als Vergleichstabelle ---------- */
function viewCompare(){
  const inB = new Set(S.ui.basket);
  const opts = S.state.matrix.rows.filter(r => !inB.has(r.slug) && !r.no_ids)
    .map(r => `<option value="${esc(r.slug)}">${esc(r.title)}</option>`).join("");
  const shown = S.plans.filter(p => p.is_ref || !S.ui.hidden.includes(p.code));
  const usable = shown.filter(p => p.rate && p.items.length);
  const cols = usable.filter(p => p.is_ref).concat(usable.filter(p => !p.is_ref));
  const none = shown.filter(p => !usable.includes(p));
  const complete = cols.filter(p => !p.missing.length && p.cost !== null);
  const win = complete.length > 1 ? complete.reduce((a, b) => b.cost < a.cost ? b : a) : null;
  const easy = complete.filter(p => p.tier <= 2);
  const winEasy = easy.length ? easy.reduce((a, b) => b.cost < a.cost ? b : a) : null;
  const de = cols.find(p => p.is_ref);

  const single = complete.filter(p => p.tier === 1 && p.via === "card" || p.is_ref).reduce((a, b) => !a || b.cost < a.cost ? b : a, null);
  const mixWins = !!(S.mix && S.mix.parts.length > 1 && (!single || S.mix.cost < single.cost - 0.5));
  let verdict = `<span class="hint">Kein Land bietet den ganzen Korb, deshalb ist nichts hervorgehoben.</span>`;
  if(win){
    const diff = de && !win.is_ref && !de.missing.length ? ` · ${eur(de.cost - win.cost)} unter Deutschland` : "";
    verdict = `<span>Günstigstes Land: <b>${esc(win.name)}</b>, ${win.estimated ? "ca. " : ""}${eur(win.cost)}${diff}` +
      (winEasy && winEasy.code !== win.code ? ` · leicht erreichbar: <b>${esc(winEasy.name)}</b>, ${eur(winEasy.cost)}` : "") +
      (mixWins ? ` · <span title="Jeder Titel im günstigsten Land mit Kartenzahlung, Aufteilung steht unter der Tabelle">aufgeteilt: <b>${eur(S.mix.cost)}</b></span>` : "") + `</span>`;
  } else if(complete.length === 1){
    verdict = `<span class="hint">Nur ${esc(complete[0].name)} bietet den ganzen Korb.</span>`;
  }
  let h = `<div class="bar on"><b>Gemeinsamer Korb</b>${verdict}<span class="sp"></span>${LEGEND}
    <select data-act="bpick"><option value="">Titel hinzufügen …</option>${opts}</select>
    <button data-act="unshare">Zurück zu Angeboten je Land</button></div>`;
  if(!cols.length) return h + `<p class="restline">Kein Titel aus dem Korb ist in einem aktiven Land kaufbar.</p>` + hiddenLine();

  const cls = p => (win && p.code === win.code ? "win " : "") + (p.missing.length ? "incomplete " : "");
  h += `<div class="cmp scroll"><table><thead><tr><th>${S.ui.basket.length} Titel</th>` + cols.map(p =>
    `<th class="${cls(p)}">${win && p.code === win.code ? `<span class="tagwin">günstigstes</span><br>` : ""}${esc(p.name)}
      <small>${p.is_ref ? "Vergleichsbasis" : "Wechsel " + esc(p.tier_name)}${p.current ? " · aktuelles Land" : ""}${p.missing.length ? ` · ${p.items.length} von ${S.ui.basket.length}` : ""}</small></th>`).join("") + `</tr></thead><tbody>`;

  for(const slug of S.ui.basket){
    const r = rowOf(slug);
    const cells = cols.map(p => p.items.find(i => i.slug === slug) || null);
    const eurs = cells.filter(Boolean).map(i => i.eur).filter(v => v !== null);
    const best = eurs.length > 1 ? Math.min(...eurs) : null;
    h += `<tr><td title="${esc(r.title)}"><button class="x" data-act="bdrop" data-s="${esc(slug)}" title="aus dem Korb nehmen">×</button>${r.dlc_of ? `<span class="dlc">DLC</span>` : ""}<a class="tl" href="${deku(slug)}" target="_blank" rel="noopener">${esc(r.title)}</a></td>` +
      cols.map((p, k) => {
        const i = cells[k];
        if(!i){
          const m = p.missing.find(x => x.slug === slug);
          return `<td class="na ${cls(p)}">–<small>${m && m.nolang ? "keine deutsche Fassung" : "nicht kaufbar"}</small></td>`;
        }
        const second = [p.currency === "EUR" ? null : priceLink(slug, p.code, num(i.local, p.currency), i, p.currency), i.end ? endCell(i.end, "bis ") : null].filter(Boolean).join(" · ");
        return `<td class="${cls(p)}${i.eur === best ? "rb" : ""}">
          <b class="${i.over ? "over" : ""}">${ax(i)}${buyLink(p.code, i, num(i.eur))}</b>${pctTag(i, p.currency)}${langTag(i, false)}${gapTag(i)}<small>${second || "&nbsp;"}</small></td>`;
      }).join("") + `</tr>`;
  }
  const row = (label, fn, extra) => `<tr class="${extra || ""}"><td>${label}</td>${cols.map(p => `<td class="${cls(p)}">${fn(p)}</td>`).join("")}</tr>`;
  h += `</tbody><tfoot>` +
    row("Summe", p => money(p.total, p.currency), "sumtop") +
    row("Karten", p => p.cards.length ? cardsHtml(p) : (p.is_ref ? ((S.state.pay[p.code] || {}).card ? "Guthabenkarten" : "exakter Betrag") : p.via === "card" ? "Kartenzahlung" : "–")) +
    row("Du zahlst", p => `<span title="${esc(costTip(p))}">${p.estimated ? "ca. " : ""}${eur(p.cost)}</span>`, "pay") +
    row("Rest", p => p.is_ref ? `<span class="ok">0</span>` : restHtml(p, true)) +
    row("Gegenüber Deutschland", p => {
      if(p.is_ref) return "Basis";
      if(p.saving === null) return "–";
      const s = `<b class="${p.saving < 0 ? "over" : "ok"}">${p.saving >= 0 ? "−" : "+"}${eur(Math.abs(p.saving))}</b>`;
      return s + (p.missing.length ? `<small>für ${p.items.length} von ${S.ui.basket.length} Titeln</small>` :
        `<small>${Math.abs(p.saving_pct)} %${!p.worth && p.saving >= 0 ? " · unter Schwelle" : ""}</small>`);
    }) +
    row("Passt dazu", p => {
      const f = p.fillers[0];
      if(!f) return "";
      return `<button class="fl" data-act="add" data-c="${p.code}" data-s="${esc(f.slugs.join(","))}" title="${esc(f.titles.join(" + "))}: Aufpreis ${eur(f.extra)} statt ${eur(f.ref)} in Deutschland. Kommt für alle Länder in den Korb.">+ ${f.shorts.map(esc).join(" + ")} <b>−${eur(f.gain)}</b></button>`;
    }) +
    row("Hinweise", p => { const c = chipsFor(p); return c.length ? `<div class="chips">${c.join("")}</div>` : ""; }) +
    `</tfoot></table></div>`;
  if(mixWins)
    h += `<p class="restline"><b>Aufgeteilt auf Länder mit Kartenzahlung:</b> ${eur(S.mix.cost)}` +
      (single ? `, das sind ${eur(single.cost - S.mix.cost)} weniger als alles in ${esc(single.name)}` : "") + `. ` +
      S.mix.parts.map(x => `${esc(x.name)} ${eur(x.cost)} (${x.titles.map(esc).join(", ")})`).join(" · ") + `</p>`;
  if(none.length)
    h += `<p class="restline">Korb dort nicht kaufbar: ` + none.map(p => esc(p.name)).join(" · ") + `</p>`;
  return h + hiddenLine();
}

/* ---------- Preisverlauf aus der eigenen Aufzeichnung ---------- */
const LINE_COLORS = ["#0d6b4f", "#c2410c", "#2563eb", "#9333ea", "#b45309", "#0891b2", "#be185d", "#4d7c0f", "#64748b", "#a16207", "#7c3aed"];
const dmy = iso => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleDateString("de-DE", {day:"2-digit", month:"2-digit", year:"numeric"}); };
const dm = iso => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleDateString("de-DE", {day:"2-digit", month:"2-digit"}); };
async function openVerlauf(slug){
  const v = await api("/api/verlauf?slug=" + encodeURIComponent(slug));
  // Sichtbar: Deutschland und jedes Land, in dem es ein Angebot gab
  S.vl = {data: v, show: new Set(v.countries.filter(c => c.code === "DE" || c.sale_count).map(c => c.code))};
  drawVerlauf();
  const d = $("verlauf");
  if(!d.open) d.showModal();
}
function drawVerlauf(){
  const v = S.vl.data, d = $("verlauf");
  const color = code => code === "DE" ? "var(--ink)" : LINE_COLORS[v.countries.findIndex(c => c.code === code) % LINE_COLORS.length];
  let h = `<header><h2>${esc(v.title)}</h2><button data-act="vlclose">Schließen</button></header>`;
  if(!v.countries.length){
    d.innerHTML = h + `<p class="hint">Noch keine Aufzeichnung für diesen Titel. Jeder Abgleich hält fest, wenn sich ein Preis ändert.</p>`;
    return;
  }
  const days = Math.max(0, (new Date(v.now) - new Date(v.since)) / 864e5);
  h += `<p class="hint">Aufgezeichnet seit ${dmy(v.since)} (${Math.round(days)} ${Math.round(days) === 1 ? "Tag" : "Tage"}). Europreise zum heutigen Kurs und Zahlweg, damit Länder und Zeitpunkte vergleichbar sind. Die Aufzeichnung kennt nur Zeiten, in denen das Tool lief.${days < 30 ? " Noch wenig Daten: Die Kurven werden mit jedem Abgleich aussagekräftiger." : ""}</p>`;
  h += `<div class="lg">` + v.countries.map(c => `<button class="${S.vl.show.has(c.code) ? "" : "off"}" data-act="vltoggle" data-c="${c.code}" title="ein- oder ausblenden"><i style="background:${color(c.code)}"></i>${esc(c.name)}</button>`).join("") + `</div>`;
  h += chartSvg(v, color);
  h += `<div class="scroll"><table><thead><tr><th>Land</th><th>jetzt</th><th>normal</th><th title="Niedrigster aufgezeichneter Preis">tiefster</th><th title="Wie oft der Titel unter dem heutigen Normalpreis lag">Angebote</th><th title="Mittlere Dauer der abgeschlossenen Angebote">Dauer</th><th title="Anteil der aufgezeichneten Zeit im Angebot">im Angebot</th><th>zuletzt</th></tr></thead><tbody>` +
    v.countries.map(c => {
      const a = c.est ? APPROX : "", last = c.sales[c.sales.length - 1];
      const lastTxt = !last ? "–" : last.end ? `${dm(last.start)}–${dm(last.end)}<small>−${last.pct} %, ${a}${eur(last.low_eur)}</small>` : `läuft seit ${dm(last.start)}<small>−${last.pct} %, ${a}${eur(last.low_eur)}</small>`;
      return `<tr><td>${esc(c.name)}</td><td>${c.now_eur === null ? "–" : a + eur(c.now_eur)}</td><td>${a}${eur(c.regular_eur)}</td>
        <td>${a}${eur(c.low_eur)}<small>${c.currency === "EUR" ? "" : money(c.low, c.currency) + " · "}${dm(c.low_at)}</small></td>
        <td>${c.sale_count}</td><td>${c.typical_days === null ? "–" : String(c.typical_days).replace(".", ",") + " T."}</td><td>${c.on_sale_pct} %</td><td>${lastTxt}</td></tr>`;
    }).join("") + `</tbody></table></div>`;
  d.innerHTML = h;
}
function chartSvg(v, color){
  // Breite nach Bildschirm, damit die Schrift auch auf dem Handy lesbar bleibt
  const W = Math.max(320, Math.min(860, window.innerWidth - 70)), H = W < 600 ? 220 : 260, L = 44, R = 10, T = 12, B = 26;
  const shown = v.countries.filter(c => S.vl.show.has(c.code));
  const t0 = +new Date(v.since), t1 = Math.max(+new Date(v.now), t0 + 864e5);
  const refs = [];
  if(v.champ_easy) refs.push({y: v.champ_easy.eur, label: "Bestpreis leicht", col: "var(--gold)"});
  if(v.typical) refs.push({y: v.typical.eur, label: "typisch", col: "var(--muted)"});
  if(v.target !== null && v.target !== undefined) refs.push({y: v.target, label: "Ziel", col: "var(--accent)"});
  const top = Math.max(1, ...shown.map(c => Math.max(c.regular_eur, ...c.points.map(p => p[2]))), ...refs.map(r => r.y)) * 1.08;
  const x = t => L + (W - L - R) * (t - t0) / (t1 - t0), y = e => T + (H - T - B) * (1 - e / top);
  let g = "";
  const step = top > 40 ? 10 : top > 16 ? 5 : top > 6 ? 2 : 1;
  for(let e = 0; e <= top; e += step) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(e)}" y2="${y(e)}"/><text x="${L - 6}" y="${y(e) + 4}" text-anchor="end">${e} €</text>`;
  const ticks = W < 600 ? 3 : 5;
  for(let i = 0; i <= ticks; i++){
    const t = t0 + (t1 - t0) * i / ticks;
    g += `<text x="${x(t)}" y="${H - 8}" text-anchor="${i === 0 ? "start" : i === ticks ? "end" : "middle"}">${dm(new Date(t).toISOString())}</text>`;
  }
  for(const r of refs) g += `<line class="ref" x1="${L}" x2="${W - R}" y1="${y(r.y)}" y2="${y(r.y)}" style="stroke:${r.col}"><title>${esc(r.label)}: ${eur(r.y)}</title></line><text x="${W - R}" y="${y(r.y) - 4}" text-anchor="end" style="fill:${r.col}">${esc(r.label)} ${eur(r.y)}</text>`;
  for(const c of shown){
    const pts = c.points, col = color(c.code);
    let p = `M${x(+new Date(pts[0][0]))},${y(pts[0][2])}`;
    for(let i = 1; i < pts.length; i++) p += `H${x(+new Date(pts[i][0]))}V${y(pts[i][2])}`;
    p += `H${x(t1)}`;
    g += `<path class="ln" d="${p}" style="stroke:${col}"${c.code === "DE" ? ` stroke-dasharray="6 4"` : ""}/>`;
    g += pts.map(q => `<circle cx="${x(+new Date(q[0]))}" cy="${y(q[2])}" r="3.5" style="fill:${col}"><title>${esc(c.name)} ${dmy(q[0])}: ${c.currency === "EUR" ? "" : money(q[1], c.currency) + ", "}${c.est ? "ca. " : ""}${eur(q[2])}</title></circle>`).join("");
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Preisverlauf in Euro">${g}</svg>`;
}

function cardInfo(text){
  let n = 0, out = 0;
  for(const line of (text || "").split(/[\n;]+/)){
    const t = line.trim();
    if(!t) continue;
    const off = /^(?:[x#!\-]\s+|\(aus\))/i.test(t);
    const body = t.replace(/^(?:[x#!\-]\s+|\(aus\)\s*)/i, "").replace(/https?:\/\/\S+/g, "").replace(/\s*=\s*/g, "=");
    const parts = (t.includes("|") || /https?:/i.test(t)) ? [body.split("|")[0]] : body.split(/\s+/);
    for(const p of parts) if(/\d/.test(p)){ n++; if(off) out++; }
  }
  return n ? `${n} ${n === 1 ? "Karte" : "Karten"} erkannt${out ? `, ${out} nicht vorrätig` : ""}` : "keine Karten eingetragen";
}

  h += S.state.countries.map(c => {
    const x = s.countries[c.code], ref = c.code === "DE", l = lv[c.code], pi = S.state.pay[c.code];
    const kurs = ref || !pi ? "" : `<span title="${pi.via === "card" ? "Kartenzahlung" : pi.card ? `beste Karte: ${money(pi.card.face, pi.currency)} für ${eur(pi.card.cost)}` : "Guthaben ohne Kartenpreis"} · 1 € = ${(1 / pi.unit).toLocaleString("de-DE", {maximumFractionDigits: 3})} ${esc(pi.currency)}" class="${pi.vs_mid < 0 ? "lvl-neg" : "lvl-pos"}">${pi.via === "giftcard" && !pi.card && !pi.at_rate ? "≈ " : ""}${pi.vs_mid > 0 ? "+" : ""}${String(pi.vs_mid).replace(".", ",")} %</span>`;
    const level = ref ? "Basis" : !l ? "–" : `<span class="${l.level < 0 ? "lvl-neg" : "lvl-pos"}" title="gemessen an ${l.titles} gemeinsamen Titeln">${l.level > 0 ? "+" : ""}${l.level} %</span> <small class="hint">${l.cheaper} günstiger, ${l.sale} im Angebot</small>`;
    return `<tr data-code="${c.code}"><td>${esc(c.name)}<span class="code">${c.code}</span></td>
      <td><input type="checkbox" data-k="enabled" ${x.enabled ? "checked" : ""} ${ref ? "disabled" : ""}></td>
      <td>${ref ? "" : `<select data-k="tier">${sel(1, x.tier, "leicht")}${sel(2, x.tier, "mittel")}${sel(3, x.tier, "schwer")}</select>`}</td>
      <td>${ref ? "" : `<select data-k="pay">${sel("card", x.pay, "Karte")}${sel("giftcard", x.pay, "Guthabenkarte")}${sel("auto", x.pay, "das Günstigere")}</select>`}</td>
      <td>${ref ? "" : `<input class="sm" type="number" data-k="markup_pct" step="0.25" value="${x.markup_pct ?? ""}" placeholder="${x.pay === "card" ? "–" : s.gift_markup_pct}" ${x.pay === "card" ? `disabled title="Gilt nur für Guthaben, hier wird per Karte bezahlt"` : ""}>`}</td>
      <td>${ref ? "" : `<input class="sm" type="number" data-k="tax_pct" step="0.5" min="0" max="50" value="${x.tax_pct || 0}">`}</td>
      <td>${ref ? "" : `<input type="number" data-k="balance" step="0.01" min="0" value="${x.balance || 0}">`}</td>
      <td>${ref ? "" : `<input type="checkbox" data-k="rest_blocks" ${x.rest_blocks ? "checked" : ""}>`}</td>
      <td style="white-space:nowrap">${kurs}</td><td style="white-space:nowrap">${level}</td></tr>`;
  }).join("");
  h += `</tbody></table></div>
    <h3 class="sec">Guthabenkarten</h3>
    <p class="hint">Eine Karte je Zeile: <code>Wert = Preis in Euro | Link</code>, zum Beispiel <code>100 = 16,00 | https://…</code>. Preis und Link sind freiwillig, ein vorangestelltes <code>x</code> heißt nicht vorrätig. Ohne Preis rechnet das Tool mit Kurs plus Aufschlag, so folgen die Kosten jedem neuen Kurs. Nur Werte wie <code>500 1000 3000</code> genügen, wenn du Guthaben zum Kurs kaufst (Amazon Japan): Dann zählt auch der Rest. Hat eine Karte einen Link, liest das Tool den Preis einmal am Tag von der Shopseite, sofern die Seite ihn ohne Browser verrät. Sonst gilt dein Wert.</p>
    <div class="cardsbox">`;
  h += S.state.countries.filter(c => c.code !== "DE" && (s.countries[c.code].enabled || s.countries[c.code].cards)).map(c => {
    const x = s.countries[c.code];
    const old = x.cards_checked && (Date.now() - new Date(x.cards_checked)) > 30 * 86400000;
    return `<label>${esc(c.name)}${c.code === "DG" ? ` <small>(deutsches Konto: nur Karten unter Nennwert lohnen, ein Rest bleibt auf dem Konto und wird ab 5 € gewarnt; Deutschland zum Shop-Preis bleibt die Vergleichsbasis)</small>` : ""}<textarea data-cards="${c.code}" spellcheck="false">${esc(x.cards)}</textarea>
      <small><span data-info="${c.code}">${cardInfo(x.cards)}</span>${x.cards_checked ? ` · <span class="${old ? "warnc" : ""}">Stand ${new Date(x.cards_checked).toLocaleDateString("de-DE")}${old ? ", bitte prüfen" : ""}</span>` : ""}</small>
      ${cardStatus(c.code, (S.state.pay[c.code] || {}).currency) ? `<small>${cardStatus(c.code, (S.state.pay[c.code] || {}).currency)}</small>` : ""}</label>`;
  }).join("");
  h += `</div></form>` + langSection() + `
    <h3 class="sec">Sicherung</h3>
    <p class="hint">Enthält Einstellungen, Guthabenkarten, Zielpreise und Körbe. Preise und Verlauf holt das Tool selbst neu.</p>
    <p style="margin-top:8px"><a class="btn" href="/api/export" download="eshop-kompass-sicherung.json">Sicherung herunterladen</a>
      <label style="margin-left:8px"><button type="button" data-act="pickfile">Sicherung einlesen</button><input type="file" id="impFile" accept=".json,application/json" hidden></label></p>
    <h3 class="sec">Letzter Abgleich</h3>
    <p class="hint" style="margin-bottom:8px">Wechselkurse vom ${esc(fxStamp())}. Das Tool holt sie bei jedem Abgleich, die Quelle erneuert sie einmal am Tag ·
      <button class="link" type="button" data-act="diag">Verbindung testen</button></p>
    <pre class="log" id="diag" ${S.diagText ? "" : "hidden"}>${esc(S.diagText || "")}</pre>
    <pre class="log" id="log" style="margin-top:8px"></pre>`;
  return h;
}
function settingsBody(form){
  const body = {countries:{}, tier_min_saving:{}};
  for(const k of ["wishlist_url","collection_url","current_country","card_fee_pct","gift_markup_pct","shop_fee_pct","shop_fee_eur","refresh_hours","lang_rule","verdict_ref"])
    body[k] = form.elements[k].value;
  body.card_market = form.elements.card_market.checked;
  for(const t of ["1","2","3"]) body.tier_min_saving[t] = form.elements["tier" + t].value;
  body.deal_eur = {buy: form.elements.deal_buy.value, good: form.elements.deal_good.value};
  form.querySelectorAll("tr[data-code]").forEach(tr => {
    const c = {};
    tr.querySelectorAll("[data-k]").forEach(el => { c[el.dataset.k] = el.type === "checkbox" ? el.checked : el.value; });
    body.countries[tr.dataset.code] = c;
  });
  form.querySelectorAll("textarea[data-cards]").forEach(el => {
    (body.countries[el.dataset.cards] = body.countries[el.dataset.cards] || {}).cards = el.value;
  });
  return body;
}
/* Sprachen von Hand bestätigen: einmal je Titel und Region */
function langSection(){
  const todo = S.state.lang_todo || [];
  const open = todo.filter(t => !t.manual), done = todo.filter(t => t.manual);
  let h = `<h3 class="sec" id="sprachen">Sprachen prüfen${open.length ? ` <span class="chip w">${open.length} offen</span>` : ""}</h3>
    <p class="hint">Gibt es einen Titel in Deutschland auf Deutsch, zählt eine Fassung aus Japan oder Amerika nur, wenn sie Deutsch enthält. Wo Nintendo keine Angabe liefert, steht hier der Titel: im Store nachsehen und einmal bestätigen. Deine Angabe gilt dauerhaft und geht der von Nintendo vor.</p>`;
  if(!todo.length) return h + `<p class="hint">Alles geprüft.</p>`;
  const row = t => `<tr><td>${esc(t.title)}</td><td>${esc(t.family_name)} <small>${t.codes.join(", ")}</small></td>
    <td>${t.url ? `<a href="${esc(t.url)}" target="_blank" rel="noopener">im Store nachsehen</a>` : ""}</td>
    <td style="white-space:nowrap">${t.manual ? `<span class="${t.state ? "ok" : "bad"}">${t.state ? "Deutsch ✓" : "ohne Deutsch"}</span> <button class="link" data-act="lang" data-s="${esc(t.slug)}" data-f="${t.family}" data-v="">zurücksetzen</button>`
      : `<button data-act="lang" data-s="${esc(t.slug)}" data-f="${t.family}" data-v="1">Deutsch ja</button> <button data-act="lang" data-s="${esc(t.slug)}" data-f="${t.family}" data-v="0">nein</button>`}</td></tr>`;
  return h + `<div class="scroll"><table><thead><tr><th>Titel</th><th>Region</th><th></th><th>Deutsch?</th></tr></thead><tbody>${open.concat(done).map(row).join("")}</tbody></table></div>`;
}
async function saveSettings(form, rerender){
  const active = () => JSON.stringify(Object.entries(S.state.settings.countries).filter(e => e[1].enabled).map(e => e[0]));
  const before = active();
  await api("/api/settings", settingsBody(form));
  const fresh = await api("/api/state");
  S.state = fresh; S.ui = fresh.ui;
  await loadPlans();
  if(rerender || before !== active()) render(); else renderHead();
  const el = $("saved");
  if(el){ el.textContent = before !== active() ? "Gespeichert. Für neue Länder bitte aktualisieren." : "Gespeichert ✓"; setTimeout(() => { if($("saved")) $("saved").textContent = ""; }, 3000); }
}

/* ---------- Ereignisse ---------- */
function ov(code){ return S.ui.overrides[code] || (S.ui.overrides[code] = {add:[], remove:[]}); }
function addTo(code, slugs){
  if(S.ui.basket){ for(const s of slugs) if(!S.ui.basket.includes(s)) S.ui.basket.push(s); return; }
  const o = ov(code);
  for(const s of slugs){
    o.remove = o.remove.filter(x => x !== s);
    if(!o.add.includes(s)) o.add.push(s);
  }
}
function dropFrom(code, s){
  if(S.ui.basket){ S.ui.basket = S.ui.basket.filter(x => x !== s); return; }
  const o = ov(code);
  o.add = o.add.filter(x => x !== s);
  if(!o.remove.includes(s)) o.remove.push(s);
}
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]");
  if(!el) return;
  const a = el.dataset.act, d = el.dataset;
  try{
    if(a === "tab"){ S.tab = d.tab; render(); window.scrollTo(0, 0); }
    else if(a === "verlauf"){ await openVerlauf(d.s); }
    else if(a === "gosprachen"){ S.tab = "settings"; render(); const t = $("sprachen"); if(t) t.scrollIntoView(); }
    else if(a === "lang"){
      await api("/api/settings", {lang_confirm: {[d.s]: {[d.f]: d.v === "" ? null : d.v === "1"}}});
      S.state = await api("/api/state"); S.ui = S.state.ui; await loadPlans(); render();
      toast(d.v === "" ? "Angabe zurückgesetzt" : "Sprache bestätigt");
    }
    else if(a === "tgtfill"){ S.ui.targets[d.s] = parseFloat(d.v); await saveUi(); await refresh(); toast("Zielpreis übernommen"); }
    else if(a === "bought"){
      const p = S.kauf.steps.find(x => x.code === d.c);
      if(!confirm(`Kauf in ${p.name} vermerken? Dein Konto steht danach dort${p.rest ? `, Rest ${money(p.rest, p.currency)}` : ""}.`)) return;
      await api("/api/bought", {code: p.code, slugs: p.items.map(i => i.slug), titles: p.items.map(i => i.short),
        cost: p.cost, de: p.de_now, rest: p.rest, currency: p.currency});
      toast(`Kauf in ${p.name} vermerkt`); await refresh(); S.kauf = await api("/api/kaufplan"); render();
    }
    else if(a === "unbought"){ await api("/api/bought/undo", {}); toast("Letzter Kauf zurückgenommen"); await refresh(); S.kauf = await api("/api/kaufplan"); render(); }
    else if(a === "vlclose"){ $("verlauf").close(); }
    else if(a === "vltoggle"){ const sh = S.vl.show; sh.has(d.c) ? sh.delete(d.c) : sh.add(d.c); drawVerlauf(); }
    else if(a === "showlog"){ S.tab = "settings"; render(); const l = $("log"); if(l) l.scrollIntoView({block:"center"}); }
    else if(a === "sync"){
      const r = await api("/api/sync", {});
      if(!r.started) toast("Ein Abgleich läuft schon, sein Protokoll steht unter Einstellungen");
      S.state.status.running = true; S.state.status.ok = null; S.state.status.step = "Abgleich startet"; render(); watch(); }
    else if(a === "dense"){ S.ui.dense = d.v === "1"; saveUi(); render(); }
    else if(a === "add"){ addTo(d.c, d.s.split(",")); await replan(); }
    else if(a === "trim"){ const name = rowOf(d.s).title; await change(`${name} entfernt`, () => dropFrom(d.c, d.s)); }
    else if(a === "reset"){ await change("Auswahl zurückgesetzt", () => { delete S.ui.overrides[d.c]; }); }
    else if(a === "hide"){ await change(`${country(d.c).name} ausgeblendet`, () => { if(!S.ui.hidden.includes(d.c)) S.ui.hidden.push(d.c); }); }
    else if(a === "unhide"){ S.ui.hidden = S.ui.hidden.filter(c => c !== d.c); await replan(); }
    else if(a === "share"){
      const slugs = S.plans.find(p => p.code === d.c).items.map(i => i.slug);
      await change("Korb gilt jetzt für alle Länder", () => { S.ui.basket = slugs; });
      window.scrollTo(0, 0);
    }
    else if(a === "unshare"){ await change("Gemeinsamer Korb aufgelöst", () => { S.ui.basket = null; }); }
    else if(a === "bdrop"){ const name = rowOf(d.s).title; await change(`${name} entfernt`, () => dropFrom(null, d.s)); }
    else if(a === "star"){
      const b = S.ui.basket || [];
      S.ui.basket = b.includes(d.s) ? b.filter(x => x !== d.s) : b.concat(d.s);
      await replan();
    }
    else if(a === "plan2basket"){
      const slugs = S.kauf.steps.flatMap(p => p.items.map(i => i.slug));
      await change("Kaufplan als Korb übernommen", () => { S.ui.basket = slugs; });
      S.tab = "plans"; render(); window.scrollTo(0, 0);
    }
    else if(a === "pickfile"){ $("impFile").click(); }
    else if(a === "diag"){
      // Eigene Box: Das Protokoll des Abgleichs läuft daneben weiter
      const l = $("diag");
      l.hidden = false;
      l.textContent = "Teste DekuDeals, Nintendo, Wechselkurse und Guthabenkarten …";
      const r = await api("/api/diag");
      S.diagText = r.lines.join("\n");   // bleibt stehen, auch wenn die Seite neu zeichnet
      l.textContent = S.diagText;
      l.scrollTop = 0;
    }
  }catch(err){ toast("Fehler: " + err.message); }
});
document.addEventListener("change", async e => {
  const el = e.target, a = el.dataset.act;
  try{
    if(el.id === "impFile" && el.files[0]){
      const data = JSON.parse(await el.files[0].text());
      await api("/api/import", data);
      await refresh();
      toast("Sicherung eingelesen");
    }
    else if(el.closest("#setForm")){ await saveSettings($("setForm"), !!el.dataset.cards || ["pay", "tax_pct", "markup_pct"].includes(el.dataset.k)); }
    else if(a === "drop"){ const name = rowOf(el.dataset.s).title; await change(`${name} entfernt`, () => dropFrom(el.dataset.c, el.dataset.s)); }
    else if((a === "pick" || a === "bpick") && el.value){ addTo(el.dataset.c, [el.value]); await replan(); }
    else if(a === "sort"){ S.ui.sort = el.value; saveUi(); render(); }
    else if(a === "onlysale"){ S.onlySale = el.checked; render(); }
    else if(a === "ronly"){ S.rOnly = el.checked; render(); }
    else if(a === "plangood"){ S.ui.plan_good = el.checked; await saveUi(); S.kauf = await api("/api/kaufplan"); render(); }
    else if(a === "target"){
      const v = parseFloat(el.value);
      if(v > 0) S.ui.targets[el.dataset.s] = v; else delete S.ui.targets[el.dataset.s];
      await saveUi();
      await refresh();
    }
  }catch(err){ toast("Fehler: " + err.message); }
});
document.addEventListener("input", e => {
  const el = e.target;
  if(el.dataset.cards){ const i = document.querySelector(`[data-info="${el.dataset.cards}"]`); if(i) i.textContent = cardInfo(el.value); return; }
  if(el.id !== "q" && el.id !== "rq") return;
  if(el.id === "q") S.filter = el.value; else S.rq = el.value;
  const pos = el.selectionStart, id = el.id;
  render();
  const q = $(id); q.focus(); q.setSelectionRange(pos, pos);
});
$("verlauf").addEventListener("click", e => {   // Klick neben das Fenster schließt es
  const d = e.currentTarget, r = d.getBoundingClientRect();
  if(e.target === d && (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom)) d.close();
});
document.addEventListener("submit", e => { if(e.target.id === "setForm") e.preventDefault(); });

refresh().catch(err => { $("main").innerHTML = `<div class="banner">Server nicht erreichbar: ${esc(err.message)}</div>`; });
</script>
</body>
</html>
