  h += open.length ? `${now ? `<p class="hint">Bei ${now} davon wäre die Fassung gerade günstiger, sie stehen oben.</p>` : ""}<div class="scroll"><table>${head}<tbody>${srt(open).map(row).join("")}</tbody></table></div>`
    : `<p class="hint">Alles geprüft ✓</p>`;
  if(done.length || auto.length)
  {
    const tdb = auto.filter(t => t.src === "titledb"), nin = auto.filter(t => t.src !== "titledb");
    h += `<details><summary class="hint">Geprüft ${auto.length + done.length}: ${nin.length} von Nintendo gelesen${tdb.length ? `, ${tdb.length} laut titledb` : ""}, ${done.length} von dir bestätigt</summary><div class="scroll"><table>${head}<tbody>${group(srt(done), "Von dir bestätigt")}${group(srt(nin), "Von Nintendo gelesen")}${group(srt(tdb), "Laut titledb (nicht von Nintendo)")}</tbody></table></div></details>`;
  }
  return h;
}
/* Browser-Helfer für Japan: Ein Lesezeichen liest die Shopseiten in deinem Browser, der durch
   den Warteraum von store-jp kommt, und gibt die Sprachen als Text zum Einfügen zurück. */
const JP_HELPER = `(async()=>{
if(location.hostname!=="store-jp.nintendo.com"){alert("Bitte zuerst eine Seite von store-jp.nintendo.com öffnen und dann das Lesezeichen anklicken.");return}
const ids=[...new Set((prompt("Japan-IDs aus eShop-Kompass einfügen")||"").match(/\\d{14}/g)||[])];
if(!ids.length)return;
const box=document.createElement("div");box.style.cssText="position:fixed;z-index:2147483647;top:12px;right:12px;width:min(440px,90vw);background:#fff;color:#111;border:2px solid #333;border-radius:8px;padding:12px;font:14px sans-serif";document.body.appendChild(box);
const wait=()=>new Promise(r=>setTimeout(r,2500));
const read=async path=>{try{const r=await fetch(path,{credentials:"include"});if(r.status===404)return{v:"",gone:true};if(!r.ok)return{v:null};
const d=new DOMParser().parseFromString(await r.text(),"text/html");
const th=[...d.querySelectorAll("th")].find(e=>e.textContent.trim()==="対応言語");
if(th){const td=th.parentElement.querySelector("td");return{v:((td&&td.querySelector("p"))||td||th).textContent.trim()}}
return{v:d.querySelector("[data-testid^=ProductDetail]")?"":null,d}}catch(e){return{v:null}}};
const out={};let bad=0,stop=false,viaGame=0;
for(let i=0;i<ids.length;i++){
box.textContent="eShop-Kompass: lese "+(i+1)+" von "+ids.length+" …";
let{v,d,gone}=await read("/item/software/D"+ids[i]);if(gone)out[ids[i]]="keine Seite";
if(v===""&&d){const a=[...d.querySelectorAll("a[href*='/item/software/D7001']")].map(e=>e.getAttribute("href").match(/D(7001\\d{10})/)).find(m=>m&&m[1]!==ids[i]);
if(a){await wait();const g=await read("/item/software/D"+a[1]);if(g.v){v=g.v;viaGame++}}}
if(v===null){if(++bad>=3){stop=true;break}}else{bad=0;if(v)out[ids[i]]=v}
await wait()}
const txt=JSON.stringify(out),n=Object.values(out).filter(x=>x!=="keine Seite").length;
box.textContent="";const p=document.createElement("p");p.textContent=(stop?"Abgebrochen, der Store lässt gerade nicht durch. ":"Fertig. ")+n+" von "+ids.length+" Titeln mit Sprachen"+(viaGame?" ("+viaGame+" DLC über die Seite des Spiels)":"")+". Kopieren und im eShop-Kompass einfügen.";
const ta=document.createElement("textarea");ta.value=txt;ta.readOnly=true;ta.style.cssText="width:100%;height:110px;margin:8px 0";
const c=document.createElement("button");c.textContent="Kopieren";c.style.marginRight="8px";
c.onclick=async()=>{ta.select();try{await navigator.clipboard.writeText(txt)}catch(e){document.execCommand("copy")}c.textContent="Kopiert ✓"};
const b=document.createElement("button");b.textContent="Schließen";b.onclick=()=>box.remove();
box.append(p,ta,c,b);
})();`;
function jpHelper(todo){
  const jp = todo.filter(t => t.family === "JP");
  if(!jp.length) return "";
  const ids = [...new Set(jp.filter(t => !t.manual && (t.state === null || t.src === "titledb")).map(t => t.nsuid))];
  return `<details class="box"><summary><b>Browser-Helfer für Japan</b> <span class="mut">${ids.length ? `${ids.length} Titel ohne Angabe von Nintendo` : "alle Japan-Titel haben eine Angabe von Nintendo"}</span></summary>
    <ol class="hint">
      <li>Zieh diesen Link einmal in deine Lesezeichenleiste: <a href="javascript:${encodeURIComponent(JP_HELPER)}" onclick="event.preventDefault();toast('Bitte in die Lesezeichenleiste ziehen, nicht anklicken')"><b>JP-Sprachen lesen</b></a></li>
      <li>Kopiere die IDs: <textarea id="jpids" readonly rows="2" style="width:100%">${ids.join(" ")}</textarea> <button data-act="jpcopy">IDs kopieren</button></li>
      <li>Öffne <a href="https://store-jp.nintendo.com/" target="_blank" rel="noopener">store-jp.nintendo.com</a>, klick das Lesezeichen an und füge die IDs ein. Es liest eine Seite alle 2,5 Sekunden.</li>
      <li>Füge das Ergebnis hier ein: <textarea id="jpimport" rows="3" style="width:100%" placeholder='{"70010000000000":"日本語, 英語, ドイツ語"}'></textarea> <button data-act="jpimport">Übernehmen</button></li>
    </ol></details>`;
}
async function saveSettings(form, rerender){
  const active = () => JSON.stringify(Object.entries(S.state.settings.countries).filter(e => e[1].enabled).map(e => e[0]));
  const before = active();
  await api("/api/settings", settingsBody(form));
  const fresh = await api("/api/state");
  S.state = fresh; S.ui = fresh.ui;
  await loadPlans();
  if(rerender || before !== active()) render(); else renderHead();
  const el = $("saved");
  if(el){ el.textContent = before !== active() ? "Gespeichert. Für neue Länder bitte aktualisieren." : "Gespeichert ✓"; setTimeout(() => { if($("saved")) $("saved").textContent = ""; }, 3000); }
}

/* ---------- Ereignisse ---------- */
function go(tab, top = true){ S.tab = tab; saveView(); render(); if(top) window.scrollTo(0, 0); }
function ov(code){ return S.ui.overrides[code] || (S.ui.overrides[code] = {add:[], remove:[]}); }
function addTo(code, slugs){
  if(S.ui.basket){ for(const s of slugs) if(!S.ui.basket.includes(s)) S.ui.basket.push(s); return; }
  const o = ov(code);
  for(const s of slugs){
    o.remove = o.remove.filter(x => x !== s);
    if(!o.add.includes(s)) o.add.push(s);
  }
}
function dropFrom(code, s){
  if(S.ui.basket){ S.ui.basket = S.ui.basket.filter(x => x !== s); return; }
  const o = ov(code);
  o.add = o.add.filter(x => x !== s);
  if(!o.remove.includes(s)) o.remove.push(s);
}
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]");
  if(!el) return;
  const a = el.dataset.act, d = el.dataset;
  try{
    if(a === "tab"){ go(d.tab); }
    else if(a === "legend"){ openLegend(); }
    else if(a === "lgclose"){ $("legend").close(); }
    else if(a === "vf"){ S.vf = d.v; saveView(); render(); }
    else if(a === "tview"){ S.tview = d.v; saveView(); render(); }
    else if(a === "mdet"){ S.mDetails = !S.mDetails; saveView(); render(); }
    else if(a === "tsort"){
      const cur = S.sorts[d.t];
      if(!cur || cur.k !== d.k) S.sorts[d.t] = {k: d.k, dir: 1};
      else if(cur.dir > 0) cur.dir = -1;
      else delete S.sorts[d.t];
      saveView();
      if(d.t === "verlauf") drawVerlauf(); else render();
    }
    else if(a === "topen"){ S.openTitle = S.openTitle === d.s ? null : d.s; render(); }

      const r = document.querySelector(`tr[data-s="${CSS.escape(d.s)}"]`); if(r) r.scrollIntoView({block:"center"});
    }

      if(!S.ui.basket){

      S.state = await api("/api/state"); S.ui = S.state.ui; render();
      toast({have: "Als vorhanden abgehakt", ignore: "DLC ignoriert", ignore_all: "Alle DLC des Spiels ignoriert"}[d.v] || "Zurückgesetzt");
    }

    }
    else if(a === "jpimport"){
      const r = await api("/api/jp_langs", {text: $("jpimport").value});

      toast(`${r.read} Titel übernommen` + (r.empty ? `, ${r.empty} ohne Sprachangabe` : "") + (r.unknown ? `, ${r.unknown} unbekannte IDs` : "") + (r.gone ? `, bei ${r.gone} ohne Seite sucht der nächste Abgleich die ID neu` : ""));
    }

      if(!confirm(`Kauf in ${p.name} vermerken? Dein Konto steht danach dort${p.rest ? `, Rest ${money(p.rest, p.currency)}` : ""}.`)) return;

        cost: p.cost, games: p.games_paid, de: p.de_now, rest: p.rest, currency: p.currency});
      if(S.ui.plan_fill && S.ui.plan_fill[p.code]){ delete S.ui.plan_fill[p.code]; await saveUi(); }
      toast(`Kauf in ${p.name} vermerkt`); await refresh(); S.kauf = await api("/api/kaufplan"); render();
    }
    else if(a === "planfill" || a === "planunfill"){
      const f = S.ui.plan_fill = S.ui.plan_fill || {}, list = f[d.c] || [];
      f[d.c] = a === "planfill" ? list.concat(d.s) : list.filter(x => x !== d.s);
      if(!f[d.c].length) delete f[d.c];
      await saveUi(); S.kauf = await api("/api/kaufplan"); render();
      toast(a === "planfill" ? "Füllartikel im Plan" : "Füllartikel herausgenommen");
    }
    else if(a === "unbought"){ await api("/api/bought/undo", {}); toast("Letzter Kauf zurückgenommen"); await refresh(); S.kauf = await api("/api/kaufplan"); render(); }
    else if(a === "vlclose"){ $("verlauf").close(); }
    else if(a === "vltoggle"){ const sh = S.vl.show; sh.has(d.c) ? sh.delete(d.c) : sh.add(d.c); drawVerlauf(); }
    else if(a === "showlog"){ go("settings", false); const l = $("log"); if(l) l.scrollIntoView({block:"center"}); }
    else if(a === "sync"){
      const r = await api("/api/sync", {});
      if(!r.started) toast("Ein Abgleich läuft schon, sein Protokoll steht unter Einstellungen");
      S.state.status.running = true; S.state.status.ok = null; S.state.status.step = "Abgleich startet"; render(); watch(); }
    else if(a === "dense"){ S.ui.dense = d.v === "1"; saveUi(); render(); }

    else if(a === "reset"){ await change("Auswahl zurückgesetzt", () => { delete S.ui.overrides[d.c]; }); }
    else if(a === "hide"){ await change(`${country(d.c).name} ausgeblendet`, () => { if(!S.ui.hidden.includes(d.c)) S.ui.hidden.push(d.c); }); }
    else if(a === "unhide"){ S.ui.hidden = S.ui.hidden.filter(c => c !== d.c); await replan(); }
    else if(a === "share"){
      const slugs = S.plans.find(p => p.code === d.c).items.map(i => i.slug);

document.addEventListener("change", async e => {
  const el = e.target, a = el.dataset.act;
  try{
    if(a === "collmissing"){ S.collMissing = el.checked; render(); return; }
    if(el.id === "impFile" && el.files[0]){
      const data = JSON.parse(await el.files[0].text());
      await api("/api/import", data);
      await refresh();
      toast("Sicherung eingelesen");
    }
    else if(el.closest("#setForm") || (el.form && el.form.id === "setForm")){
      await saveSettings($("setForm"), !!el.dataset.cards || ["pay", "tax_pct", "markup_pct"].includes(el.dataset.k) ||
        ["deal_buy", "deal_good", "tier1", "tier2", "tier3"].includes(el.name));
    }
    else if(a === "drop"){ const name = rowOf(el.dataset.s).title; await change(`${name} entfernt`, () => dropFrom(el.dataset.c, el.dataset.s)); }
    else if((a === "pick" || a === "bpick") && el.value){ addTo(el.dataset.c, [el.value]); await replan(); }
    else if(a === "sort"){ S.ui.sort = el.value; saveUi(); render(); }
    else if(a === "tsortsel"){ if(el.value){ const [k, dir] = el.value.split(":"); S.sorts[el.dataset.t] = {k, dir: +dir}; } else delete S.sorts[el.dataset.t]; saveView(); render(); }
    else if(a === "colorder"){ S.colOrder = el.value; saveView(); render(); }
    else if(a === "onlysale"){ S.onlySale = el.checked; render(); }
    else if(a === "acct" || a === "bal"){
      const s = S.state.settings, cur = s.current_country;
      const body = a === "acct" ? {current_country: el.value}
        : {countries: {[cur]: {balance: Math.max(0, parseFloat(el.value) || 0)}}};
      const back = a === "acct" ? {current_country: cur}
        : {countries: {[cur]: {balance: (s.countries[cur] || {}).balance || 0}}};
      await api("/api/settings", body); await refresh();
      toast(a === "acct" ? (el.value ? `Konto steht in ${country(el.value).name}` : "Konto ohne Land") : "Guthaben gespeichert",
        async () => { await api("/api/settings", back); await refresh(); });
    }
    else if(a === "plangood"){ S.ui.plan_good = el.checked; await saveUi(); S.kauf = await api("/api/kaufplan"); render(); }
    else if(a === "target"){
      const v = parseFloat(el.value);
      if(v > 0) S.ui.targets[el.dataset.s] = v; else delete S.ui.targets[el.dataset.s];
      await saveUi();
      await refresh();
    }
  }catch(err){ toast("Fehler: " + err.message); }
});
